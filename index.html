<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Saitenflug</title>
<style>
  :root{--ink:#2a160a;--parch:#f1e2bd;--parch2:#e0cb98;--brass:#c98b2b}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:#120a05;
    overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none}
  body{display:flex;justify-content:center;font-family:Georgia,'Times New Roman',serif;color:var(--ink)}
  #stage{position:relative;width:100%;max-width:520px;height:100%;touch-action:none;
    user-select:none;-webkit-user-select:none;overflow:hidden}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}

  #mute{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:40px;height:40px;
    border-radius:50%;border:2px solid var(--brass);background:rgba(30,16,8,.78);color:#f6e7c1;
    font-size:18px;cursor:pointer;z-index:5}
  #mute:focus-visible,#btn:focus-visible{outline:3px solid #ffe29a;outline-offset:3px}

  #overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;justify-content:center;
    overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:14px 0;
    background:rgba(10,5,2,.5);z-index:4;opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .25s,visibility 0s .25s}
  #overlay.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .25s}
  .ticketWrap{width:min(88%,350px);margin:auto 0;flex:none}
  .tTop,.tStub{background:linear-gradient(170deg,var(--parch),var(--parch2));
    -webkit-mask-composite:source-in;mask-composite:intersect}
  .tTop{padding:26px 24px 20px;border-radius:12px 12px 0 0;
    -webkit-mask-image:radial-gradient(circle 12px at 0 100%,#0000 97%,#000),radial-gradient(circle 12px at 100% 100%,#0000 97%,#000);
    mask-image:radial-gradient(circle 12px at 0 100%,#0000 97%,#000),radial-gradient(circle 12px at 100% 100%,#0000 97%,#000)}
  .tStub{padding:18px 24px 22px;text-align:center;border-radius:0 0 12px 12px;
    border-top:2px dashed rgba(42,22,10,.4);background:linear-gradient(170deg,#e8d5a6,#d6bd86);
    -webkit-mask-image:radial-gradient(circle 12px at 0 0,#0000 97%,#000),radial-gradient(circle 12px at 100% 0,#0000 97%,#000);
    mask-image:radial-gradient(circle 12px at 0 0,#0000 97%,#000),radial-gradient(circle 12px at 100% 0,#0000 97%,#000)}
  h1{font-size:40px;line-height:1.05;font-weight:700;letter-spacing:.5px;margin-bottom:8px}
  #ovText{font-size:16px;line-height:1.4}
  #stats{font-size:17px;line-height:1.5;margin-bottom:12px;font-weight:700}
  #stats span{display:block}
  #stats .small{font-size:14px;font-weight:400;opacity:.8}

  #board{margin-top:14px;font-size:15px}
  #board h2{font-size:15px;font-weight:700;margin-bottom:3px}
  #board ol{list-style:none}
  #board li{display:flex;gap:10px;padding:2px 4px;border-bottom:1px dotted rgba(42,22,10,.35)}
  #board li .r{width:18px}
  #board li .s{flex:1;font-weight:700}
  #board li .d{font-size:13px;opacity:.65}
  #board li.new{background:rgba(201,139,43,.4);border-radius:4px}

  #settings{margin-top:14px;border-top:2px dashed rgba(42,22,10,.3);padding-top:10px}
  #settings summary{list-style:none;cursor:pointer;position:relative;padding-right:24px;font-weight:700;font-size:15px}
  #settings summary::-webkit-details-marker{display:none}
  #settings summary::after{content:'▾';position:absolute;right:2px;top:0;font-size:16px;transition:transform .2s}
  #settings[open] summary::after{transform:rotate(180deg)}
  #settings summary small{display:block;font-weight:400;font-size:12.5px;opacity:.7;margin-top:1px}
  .grp{margin-top:14px}
  .lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;padding:6px 12px;border-radius:999px;
    background:rgba(255,255,255,.25);border:2px solid rgba(42,22,10,.3)}
  .chip[aria-pressed=true],.gbtn[aria-pressed=true]{border-color:var(--ink);background:rgba(201,139,43,.45);font-weight:700}
  .chip:focus-visible,.gbtn:focus-visible{outline:3px solid #7a4f12;outline-offset:2px}

  #range{position:relative;height:30px}
  #range .rtrack{position:absolute;left:13px;right:13px;top:13px;height:4px;border-radius:2px;background:rgba(42,22,10,.25)}
  #range .rfill{position:absolute;top:13px;height:4px;border-radius:2px;background:var(--ink)}
  #range input{position:absolute;left:0;top:0;width:100%;height:30px;margin:0;background:none;
    -webkit-appearance:none;appearance:none;pointer-events:none;touch-action:none;outline:none}
  #range input::-webkit-slider-runnable-track{background:none;height:30px;border:0}
  #range input::-moz-range-track{background:none;border:0}
  #range input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;pointer-events:auto;width:26px;height:26px;
    margin-top:2px;border-radius:50%;border:2px solid var(--ink);background:linear-gradient(#f0b94d,#c98b2b);
    box-shadow:0 2px 0 #7a4f12;cursor:pointer}
  #range input::-moz-range-thumb{pointer-events:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);
    background:linear-gradient(#f0b94d,#c98b2b);box-shadow:0 2px 0 #7a4f12;cursor:pointer}
  .cnt{font-size:12.5px;opacity:.75;margin-top:4px}
  .cnt.bad{color:#8c1d12;opacity:1;font-weight:700}

  #picker{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .gbtn{font-family:inherit;color:var(--ink);font-size:12px;line-height:1.1;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;
    background:rgba(255,255,255,.25);border:2px solid rgba(42,22,10,.3);border-radius:10px}
  .gbtn canvas{position:static;width:38px;height:64px}

  #btn{font-family:inherit;font-size:19px;font-weight:700;color:var(--ink);cursor:pointer;
    padding:12px 30px;border-radius:8px;border:2px solid var(--ink);
    background:linear-gradient(#f0b94d,#c98b2b);box-shadow:0 4px 0 #7a4f12;transition:transform .08s,box-shadow .08s}
  #btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a4f12}
  #btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:0 4px 0 #7a4f12}
  @media (prefers-reduced-motion:reduce){#overlay{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <button id="mute" aria-label="Ton an oder aus">🔊</button>
  <div id="overlay" class="show">
    <div class="ticketWrap">
      <div class="tTop">
        <h1 id="ovTitle">Saitenflug</h1>
        <p id="ovText">Flieg durch das Tor mit dem passenden Interpreten.</p>
        <div id="board" hidden></div>
        <details id="settings" open>
          <summary>Einstellungen<small id="sumTxt"></small></summary>
          <div class="grp"><div class="lbl">Genre</div><div id="genres" class="chips" role="group" aria-label="Genre"></div></div>
          <div class="grp">
            <div class="lbl"><span>Zeitraum</span><span id="rangeTxt"></span></div>
            <div id="range">
              <div class="rtrack"></div><div class="rfill" id="rfill"></div>
              <input type="range" id="rlo" min="0" max="166" step="1" aria-label="Von Jahr">
              <input type="range" id="rhi" min="0" max="166" step="1" aria-label="Bis Jahr">
            </div>
            <div class="cnt" id="cnt"></div>
          </div>
          <div class="grp"><div class="lbl">Gitarre</div><div id="picker" role="group" aria-label="Gitarre wählen"></div></div>
        </details>
      </div>
      <div class="tStub">
        <div id="stats" hidden></div>
        <button id="btn">Losfliegen</button>
      </div>
    </div>
  </div>
</div>

function rr(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

const GENRES = [['mix','Mix'],['r','Rock'],['p','Pop'],['d','Deutsch'],['h','Hip-Hop'],['x','Rap'],['k','Klassik']];
const RMAX = 166;                                   // Regler: 1500-1900 in 10er-Schritten, danach Jahr für Jahr
const posYear = p => p <= 40 ? 1500 + p*10 : 1900 + (p - 40);
const MIN_SONGS = 5;
const cfg = { genre: 'mix', lo: 0, hi: RMAX, guitar: 0 };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('saitenflug_cfg') || '{}')); } catch (e) {}
if (!GENRES.some(g => g[0] === cfg.genre)) cfg.genre = 'mix';
cfg.lo = clamp(Math.round(+cfg.lo) || 0, 0, RMAX); cfg.hi = clamp(Math.round(+cfg.hi) || RMAX, 0, RMAX);
if (cfg.lo > cfg.hi) cfg.lo = cfg.hi;

function songPool(){
  const lo = posYear(cfg.lo), hi = posYear(cfg.hi);
  return SONGS.filter(s => (cfg.genre === 'mix' || s.tags.includes(cfg.genre)) && s.year >= lo && s.year <= hi);
}
function pickDecoys(song, pool){
  const lo = posYear(cfg.lo), hi = posYear(cfg.hi);
  const overlap = s => s.artist !== song.artist && [...s.tags].some(t => song.tags.includes(t));
  const tiers = [
    () => pool.filter(overlap),
    () => SONGS.filter(s => overlap(s) && s.year >= lo - 25 && s.year <= hi + 25),
    () => SONGS.filter(overlap),
    () => SONGS.filter(s => s.artist !== song.artist)
  ];
  for (const t of tiers){
    const names = [...new Set(t().map(s => s.artist))];
    if (names.length >= 2) return shuffle(names).slice(0, 2);
  }
  return ['Unbekannt', 'Anonym'];
}

const Snd = {
  ctx: null, master: null, noise: null, muted: false,
  voice: { mul: 1, bright: 9, wave: 'sawtooth', gain: 1 },
  setVoice(i){ const G = GUITARS[i]; this.voice = { mul: G.mul, bright: G.bright, wave: G.wave, gain: G.gain }; },
  init(){
    if (this.ctx){ if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.8;
    this.master.connect(this.ctx.destination);
    const len = this.ctx.sampleRate; const b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = b.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random()*2-1; this.noise = b;
  },
  setMuted(m){ this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.8; },
  pluck(freq, delay = 0, vol = .25, dur = .9){
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + delay;
    const v = this.voice; freq *= v.mul; vol *= v.gain;
    const o1 = c.createOscillator(), o2 = c.createOscillator();
    o1.type = v.wave; o2.type = 'triangle';
    o1.frequency.value = freq; o2.frequency.value = freq * 2.004;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 1;
    f.frequency.setValueAtTime(freq * v.bright, t); f.frequency.exponentialRampToValueAtTime(freq * 1.2, t + dur * .6);
    const g = c.createGain(); g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    const g2 = c.createGain(); g2.gain.value = .35;
    o1.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(this.master);
    o1.start(t); o2.start(t); o1.stop(t + dur + .05); o2.stop(t + dur + .05);
  },
  burst(delay, dur, vol, freq, type = 'bandpass'){
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = .8;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + .05);
  },
  thud(delay = 0){
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(38, t + .35);
    const g = c.createGain(); g.gain.setValueAtTime(.6, t); g.gain.exponentialRampToValueAtTime(.0001, t + .4);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + .45);
  },
  start(){ [164.81, 246.94, 329.63, 415.30, 493.88].forEach((f, i) => this.pluck(f, i * .045, .2, 1.3)); },
  right(n){
    const pent = [329.63, 370, 415.3, 493.88, 554.37]; const f = pent[n % 5];
    this.pluck(f, 0, .22, .7); this.pluck(f * 1.5, .09, .2, .8); this.pluck(f * 2, .18, .16, .9);
  },
  milestone(){ [392, 493.88, 587.33, 783.99].forEach((f, i) => this.pluck(f, .32 + i * .07, .17, .8)); },
  wrong(){
    this.burst(0, .5, .45, 1800, 'highpass'); this.burst(0, .08, .5, 5200);
    this.thud(); this.pluck(185, 0, .3, .9); this.pluck(196, .02, .3, .9); this.pluck(277, .04, .25, .9);
  },
  click(){ this.pluck(660, 0, .12, .25); }
};

/* ============ Holz-Boden (Kachel, wird gescrollt) ============ */
const TH = 960;
function makeWood(){
  const [c, g] = mkCanvas(W, TH);
  const n = Math.max(4, Math.round(W / 92)), pw = W / n, rnd = mulberry(11);
  for (let i = 0; i < n; i++){
    const x = i * pw;
    g.fillStyle = `hsl(${21 + rnd()*9} 42% ${16 + rnd()*7}%)`; g.fillRect(x, 0, pw, TH);
    for (let k = 0; k < 26; k++){
      const gx = x + rnd()*pw, amp = 1 + rnd()*3, fr = 1 + Math.floor(rnd()*4), ph = rnd()*6.28;
      g.beginPath();
      for (let y = 0; y <= TH; y += 12){ const xx = gx + amp*Math.sin(ph + y/TH*Math.PI*2*fr); y ? g.lineTo(xx, y) : g.moveTo(xx, y); }
      g.strokeStyle = rnd() < .5 ? `rgba(0,0,0,${.06 + rnd()*.1})` : `rgba(255,200,130,${.03 + rnd()*.05})`;
      g.lineWidth = .6 + rnd()*1.4; g.stroke();
    }
    if (rnd() < .6){
      const kx = x + pw*(.25 + rnd()*.5), ky = 80 + rnd()*800;
      for (let r = 3; r < 13; r += 3){ g.beginPath(); g.ellipse(kx, ky, r*.7, r*1.5, 0, 0, 6.3); g.strokeStyle = `rgba(10,5,2,${.5 - r*.03})`; g.lineWidth = 1.2; g.stroke(); }
    }
    const j0 = 40 + rnd()*220, j1 = j0 + 440 + rnd()*60;
    [j0, j1].forEach(j => {
      g.fillStyle = 'rgba(8,4,2,.8)'; g.fillRect(x, j, pw, 2.5);
      g.fillStyle = 'rgba(255,200,130,.08)'; g.fillRect(x, j + 2.5, pw, 1);
      [x + 8, x + pw - 8].forEach(nx => {
        g.fillStyle = '#15100c'; g.beginPath(); g.arc(nx, j + 12, 1.8, 0, 6.3); g.fill();
        g.fillStyle = 'rgba(255,230,190,.25)'; g.beginPath(); g.arc(nx - .5, j + 11.4, .7, 0, 6.3); g.fill();
      });
    });
    g.fillStyle = 'rgba(5,2,1,.85)'; g.fillRect(x - .75, 0, 1.5, TH);
    g.fillStyle = 'rgba(255,200,130,.07)'; g.fillRect(x + 1.2, 0, 1, TH);
  }
  return c;
}

function buildStatic(){
  let g;
  [under, g] = mkCanvas(W, H);
  [W*.22, W*.78].forEach(cx => {
    const gr = g.createLinearGradient(0, 0, 0, H*.8); gr.addColorStop(0, 'rgba(255,190,100,.10)'); gr.addColorStop(1, 'rgba(255,190,100,0)');
    g.fillStyle = gr; g.beginPath(); g.moveTo(cx - 14, 0); g.lineTo(cx + 14, 0); g.lineTo(cx + 120, H*.8); g.lineTo(cx - 120, H*.8); g.fill();
  });
  for (const side of [0, 1]){
    g.save(); if (side){ g.translate(W, 0); g.scale(-1, 1); }
    const cg = g.createLinearGradient(0, 0, 13, 0);
    cg.addColorStop(0, '#2c0a07'); cg.addColorStop(.35, '#7a2218'); cg.addColorStop(.6, '#4b130d'); cg.addColorStop(1, '#220806');
    g.fillStyle = cg; g.fillRect(0, 0, 13, H);
    const sg = g.createLinearGradient(13, 0, 40, 0); sg.addColorStop(0, 'rgba(0,0,0,.4)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sg; g.fillRect(13, 0, 27, H); g.restore();
  }
  [over, g] = mkCanvas(W, H);
  const cx = W/2, cy = H*.55, vg = g.createRadialGradient(cx, cy, Math.min(W, H)*.3, cx, cy, Math.max(W, H)*.85);
  vg.addColorStop(0, 'rgba(8,3,1,0)'); vg.addColorStop(1, 'rgba(8,3,1,.65)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
}

const SPRITES = {};
function makeSprite(type){
  const c = document.createElement('canvas'); c.width = c.height = 160;
  const g = c.getContext('2d'); g.scale(1.6, 1.6);
  g.fillStyle = g.strokeStyle = '#0d0602'; g.lineCap = g.lineJoin = 'round';
  const cut = () => g.globalCompositeOperation = 'destination-out';

    case 'drum':
      g.beginPath(); g.ellipse(50, 34, 36, 12, 0, 0, 6.3); g.fill();
      g.fillRect(14, 34, 72, 36);
      g.beginPath(); g.ellipse(50, 70, 36, 12, 0, 0, 6.3); g.fill();
      cut(); g.lineWidth = 2;
      g.beginPath(); g.ellipse(50, 34, 29, 8, 0, 0, 6.3); g.stroke();
      g.beginPath(); for (let i = 0; i <= 10; i++){ const x = 15 + i*7, y = i%2 ? 68 : 42; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
      solid(); g.lineWidth = 5; g.beginPath(); g.moveTo(18, 6); g.lineTo(58, 30); g.moveTo(82, 6); g.lineTo(42, 30); g.stroke();
      break;
    case 'trumpet':
      g.lineWidth = 6; g.beginPath(); g.moveTo(6, 56); g.lineTo(66, 56); g.stroke();
      g.beginPath(); g.moveTo(64, 53); g.lineTo(95, 32); g.lineTo(95, 80); g.lineTo(64, 59); g.closePath(); g.fill();
      g.lineWidth = 4.5; rr(g, 22, 36, 36, 20, 8); g.stroke();
      g.lineWidth = 4; g.beginPath(); [34, 43, 52].forEach(x => { g.moveTo(x, 56); g.lineTo(x, 72); }); g.stroke();
      [34, 43, 52].forEach(x => { g.beginPath(); g.arc(x, 75, 3.5, 0, 6.3); g.fill(); });
      break;
    case 'vinyl':
      g.beginPath(); g.arc(50, 50, 46, 0, 6.3); g.fill();
      cut(); g.lineWidth = 1.6;
      [38, 30, 22].forEach(r => { g.beginPath(); g.arc(50, 50, r, 0.3, 5.6); g.stroke(); });
      g.lineWidth = 2.5; g.beginPath(); g.arc(50, 50, 14, 0, 6.3); g.stroke();
      g.beginPath(); g.arc(50, 50, 3, 0, 6.3); g.fill();
      break;
    case 'guitar':
      g.save(); g.translate(50, 66); g.rotate(.35); g.scale(.74, .74);
      guitarBody(g); g.fill(); g.fillRect(-4.5, -84, 9, 62); g.fillRect(-6.5, -98, 13, 17);
      cut(); g.beginPath(); g.arc(0, 4, 7, 0, 6.3); g.fill();
      g.lineWidth = 1.2; for (let i = 0; i < 6; i++){ g.beginPath(); g.moveTo(-4.5, -78 + i*10); g.lineTo(4.5, -78 + i*10); g.stroke(); }
      g.restore(); break;
    case 'tambourine':
      g.lineWidth = 10; g.beginPath(); g.arc(50, 50, 40, 0, 6.3); g.stroke();
      cut(); for (let i = 0; i < 6; i++){ const a = i*Math.PI/3 + .3; g.beginPath(); g.arc(50 + Math.cos(a)*40, 50 + Math.sin(a)*40, 3.4, 0, 6.3); g.fill(); }
      solid(); for (let i = 0; i < 6; i++){ const a = i*Math.PI/3 + .6; g.beginPath(); g.arc(50 + Math.cos(a)*40, 50 + Math.sin(a)*40, 6, 0, 6.3); g.fill(); }
      break;
    case 'keys':
      g.lineWidth = 4; rr(g, 6, 28, 88, 44, 4); g.stroke();
      g.lineWidth = 1.6; g.beginPath(); for (let i = 1; i < 8; i++){ g.moveTo(6 + i*11, 28); g.lineTo(6 + i*11, 72); } g.stroke();
      [1,2,4,5,6].forEach(i => g.fillRect(6 + i*11 - 3.5, 28, 7, 26));

    const t = cur ? cur + (k.sp ? ' ' : '') + k.t : k.t;

}

    font = `${style} ${s}px Georgia, 'Times New Roman', serif`; lines = wrapLines(text, font, maxW);
    if (lines.length <= maxLines && lines.every(l => ctx.measureText(l).width <= maxW) && lines.length*s*1.15 <= maxH)

}

  if (lane === g.correct){
    g.state = 'right'; score++;
    Snd.right(score - 1); if (score % 5 === 0) Snd.milestone();
    burst(gx, guitarY);
    if (score > best) best = score;
    if (!recordShown && prevBest > 0 && score > prevBest){
      recordShown = true; Snd.milestone();
      parts.push({ type: 'text', x: W/2, y: H*.32, vx: 0, vy: -25, g: 0, life: 1.8, max: 1.8, size: 30, ch: 'Neuer Rekord!', color: '#ffe29a', rot: 0, vr: 0 });
    }
  } else { g.state = 'wrong'; die(g); }
}
function die(g){
  state = 'dying'; dieT = 0; shake = 1; flash = 1; overShown = false; deadGate = g;
  newIdx = addScore(score); Snd.wrong(); debris(gx, guitarY);
}

function showOverlay(o){
  $('ovTitle').textContent = o.title; $('ovText').textContent = o.text;
  renderBoard(o.hi ?? -1, o.limit || 5); $('settings').open = !!o.open;
  const st = $('stats');
  if (o.stats){ st.hidden = false; st.innerHTML = ''; o.stats.forEach((t, i) => { const s = document.createElement('span'); s.textContent = t; if (i) s.className = 'small'; st.appendChild(s); }); }
  else st.hidden = true;
  btn.textContent = o.btn; overlay.scrollTop = 0; overlay.classList.add('show');
  setTimeout(() => { try { btn.focus({ preventScroll: true }); } catch (e) {} }, 60);
}
function showGameOver(){
  const g = deadGate; overShown = true;
  const record = score > 0 && prevBest > 0 && score > prevBest;
  showOverlay({
    title: record ? 'Neuer Rekord!' : 'Falscher Ton.',
    text: `„${g.title}“ ist von ${g.artist}.`,
    stats: [`${score} ${score === 1 ? 'Tor' : 'Tore'}`, record ? `Vorher: ${prevBest}` : `Bestwert: ${best}`],
    hi: newIdx, btn: 'Nochmal fliegen'
  });
}

function update(dt){
  time += dt;
  let v;
  if (state === 'menu') v = 55;
  else if (state === 'play'){ speed = Math.min(140 + score*5.5, 300); gapT = Math.max(1.6, 5 - score*.12); v = speed; }
  else { dieT += dt; v = speed * Math.max(.1, 1 - dieT*2.5); }
  const dv = v*dt; scroll += dv;

  for (const d of decor) d.y += dv;
  while (decor.length && decor[0].y > H + 170) decor.shift();
  decorAcc += dv; if (decorAcc >= nextDecor){ decorAcc = 0; nextDecor = rand(150, 280); spawnDecor(-150); }
  for (const m of dust){ m.y += dv*m.s; if (m.y > H + 4){ m.y = -4; m.x = rand(0, W); } }
  for (const g of gates) g.y += dv;
  while (gates.length && gates[0].y > H + 20){ const g = gates.shift(); if (g.cv) gatePool.push(g.cv); }

  if (state === 'menu'){ gx = W/2 + Math.sin(time*1.2)*30; tilt = Math.cos(time*1.2)*.12; }
  else if (state === 'play'){
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir) tx += dir*540*dt;
    tx = clamp(tx, GM, W - GM);
    const prev = gx; gx += (tx - gx) * Math.min(1, dt*11);
    const vx = (gx - prev) / Math.max(dt, .001);
    tilt += (clamp(vx*.0018, -.45, .45) - tilt) * Math.min(1, dt*10);

    const spacing = speed * gapT;
    if (!gates.length || gates[gates.length-1].y >= spacing - GATE_TOTAL) gates.push(makeGate(-GATE_TOTAL));
    for (const g of gates){ if (g.state === 'open' && g.y + GATE_FOCUS >= guitarY){ resolveGate(g); break; } }
  }
  if (state !== 'dying'){
    trailT -= dt;
    if (trailT <= 0){ trailT = .09;
      note(gx + rand(-7, 7), guitarY + 32, rand(-12, 12), v*.7 + rand(0, 30), { life: .9, size: rand(12, 20), color: Math.random() < .5 ? '#f6e7c1' : '#f2b441', back: true }); }
  }
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i]; p.life -= dt; if (p.life <= 0){ parts.splice(i, 1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += p.g*dt; p.rot += p.vr*dt;
  }
  shake = Math.max(0, shake - dt*2.2); flash = Math.max(0, flash - dt*2.5);
  if (state === 'dying' && !overShown && dieT > 1.2) showGameOver();
}

/* ============ Zeichnen ============ */
function drawBackground(){
  const off = snap(scroll % TH);
  for (let y = off - TH; y < H; y += TH) ctx.drawImage(wood, 0, y, W, TH);
  ctx.globalAlpha = .3;
  for (const d of decor){
    ctx.save(); ctx.translate(snap(d.x + d.size/2), snap(d.y + d.size/2)); ctx.rotate(d.rot);
    ctx.drawImage(SPRITES[d.type], -d.size/2, -d.size/2, d.size, d.size); ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.drawImage(under, 0, 0, under.width/DPR, under.height/DPR);
  for (const m of dust){ ctx.fillStyle = m.c; ctx.fillRect(m.x, m.y, m.r*2, m.r*2); }
}

function renderGate(c, g){
  const lw = W/3, y = 0;
  if (!g.fit || g.fit.w !== W){
    const bw = W - 28, sw = lw - 24;
    g.fit = { w: W,
      title: fit(`„${g.title}“`, bw - 52, GATE_BANNER - 16, 2, 22, 12, 'italic bold'),
      opts: g.opts.map(o => fit(o, sw - 18, 66, 3, 18, 10, 'bold')) };
  }
  const bx = 14, bw = W - 28, bh = GATE_BANNER - 4;
  c.strokeStyle = '#2a160a'; c.lineWidth = 2;
  [bx + 26, bx + bw - 26].forEach(x => { c.beginPath(); c.moveTo(x, y - PAD_TOP); c.lineTo(x, y + 4); c.stroke(); });
  c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath();
  c.moveTo(bx+3, y+6); c.lineTo(bx+bw+3, y+6); c.lineTo(bx+bw-7, y+bh/2+6); c.lineTo(bx+bw+3, y+bh+6); c.lineTo(bx+3, y+bh+6); c.lineTo(bx+13, y+bh/2+6); c.fill();
  const bg = c.createLinearGradient(0, y, 0, y + bh); bg.addColorStop(0, '#f6e9c6'); bg.addColorStop(1, '#dcc58f');
  c.fillStyle = bg; c.beginPath();
  c.moveTo(bx, y); c.lineTo(bx+bw, y); c.lineTo(bx+bw-10, y+bh/2); c.lineTo(bx+bw, y+bh); c.lineTo(bx, y+bh); c.lineTo(bx+10, y+bh/2); c.closePath();
  c.fill(); c.strokeStyle = '#5b3a1c'; c.lineWidth = 2; c.stroke();
  c.fillStyle = '#2a160a'; drawLines(c, g.fit.title, W/2, y + bh/2 + 1);

  const y1 = y + GATE_BANNER + GATE_GAP;
  for (let i = 0; i < 3; i++){
    let top = 'rgba(255,196,110,.17)', bot = 'rgba(255,196,110,.04)';
    if (g.state !== 'open'){
      if (i === g.correct){ top = 'rgba(100,215,110,.34)'; bot = 'rgba(100,215,110,.08)'; }
      else if (i === g.chosen){ top = 'rgba(230,70,55,.4)'; bot = 'rgba(230,70,55,.1)'; }
    }
    const gr = c.createLinearGradient(0, y1, 0, y1 + GATE_H); gr.addColorStop(0, top); gr.addColorStop(1, bot);
    c.fillStyle = gr; c.fillRect(i*lw, y1, lw, GATE_H);
  }
  const lg = c.createLinearGradient(0, y1 - 4, 0, y1 + 8); lg.addColorStop(0, '#74492a'); lg.addColorStop(1, '#3a2212');
  c.fillStyle = lg; c.fillRect(0, y1 - 4, W, 12);
  c.fillStyle = 'rgba(201,139,43,.8)'; c.fillRect(0, y1 - 4, W, 1.5);
  for (let i = 0; i < 3; i++){
    const sx = i*lw + 12, sw = lw - 24, sy = y1 + 16, sh = GATE_H - 32;
    let fill = '#2a170b', stroke = '#c98b2b', alpha = 1;
    if (g.state !== 'open'){
      if (i === g.correct){ fill = '#25502b'; stroke = '#9be89b'; }
      else if (i === g.chosen){ fill = '#5a1d17'; stroke = '#ff8f80'; }
      else alpha = .5;
    }
    c.globalAlpha = alpha;
    c.strokeStyle = '#1a0e06'; c.lineWidth = 1.5;
    [sx + 14, sx + sw - 14].forEach(x => { c.beginPath(); c.moveTo(x, y1 + 6); c.lineTo(x, sy + 2); c.stroke(); });
    c.fillStyle = 'rgba(0,0,0,.4)'; rr(c, sx + 2, sy + 4, sw, sh, 7); c.fill();
    c.fillStyle = fill; rr(c, sx, sy, sw, sh, 7); c.fill();
    c.strokeStyle = stroke; c.lineWidth = 2.5; c.stroke();
    c.fillStyle = '#f6e7c1'; drawLines(c, g.fit.opts[i], sx + sw/2, sy + sh/2 + 1);
    c.globalAlpha = 1;
  }
  for (let i = 0; i < 4; i++){
    const px = i*lw, top = y1 - 8, hgt = GATE_H + 12;
    c.fillStyle = '#5a371d'; c.fillRect(px - 7, top, 14, hgt);
    c.fillStyle = '#24120a'; c.fillRect(px - 4.5, top + 4, 9, hgt - 4);
    c.fillStyle = 'rgba(214,170,90,.85)';
    for (let fy = top + 14; fy < top + hgt; fy += 14) c.fillRect(px - 4.5, fy, 9, 1.3);
    c.fillStyle = '#c98b2b'; c.beginPath(); c.arc(px, top - 1, 5.5, 0, 6.3); c.fill();
    c.strokeStyle = '#2a160a'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = 'rgba(255,240,200,.5)'; c.beginPath(); c.arc(px - 1.5, top - 2.5, 1.5, 0, 6.3); c.fill();
  }
}
const GATE_CH = PAD_TOP + GATE_TOTAL + 8;
function gateCanvas(g){
  if (!g.cv) g.cv = document.createElement('canvas');
  const w = Math.ceil(W*DPR), h = Math.ceil(GATE_CH*DPR);
  if (g.cv.width !== w || g.cv.height !== h){ g.cv.width = w; g.cv.height = h; g.dirty = true; }
  if (g.dirty){
    const c = g.cv.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, W, GATE_CH);
    c.save(); c.translate(0, PAD_TOP); renderGate(c, g); c.restore(); g.dirty = false;
  }
  return g.cv;
}

function drawParticles(back){
  for (const p of parts){
    if (!!p.back !== back) continue;
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    if (p.type === 'dot'){ ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size*2, p.size*2); }
    else {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.type === 'chip'){ ctx.fillStyle = p.color; ctx.fillRect(-p.size, -p.size/2, p.size*2, p.size); }
      else {
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        if (p.type === 'text'){ ctx.font = `bold ${p.size}px Georgia, serif`; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,14,5,.8)'; ctx.strokeText(p.ch, 0, 0); }
        else ctx.font = `${p.size}px serif`;
        ctx.fillStyle = p.color; ctx.fillText(p.ch, 0, 0);
      }
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

let hud = null;
function drawHUD(){
  if (state === 'menu') return;
  if (!hud || hud.s !== score || hud.b !== best){
    const label = `♪ ${score}`; ctx.font = 'bold 21px Georgia, serif';
    const w1 = ctx.measureText(label).width; let bw = w1 + 28, bt = '';
    if (best > 0){ bt = `Bestwert ${best}`; ctx.font = '13px Georgia, serif'; bw += ctx.measureText(bt).width + 12; }
    hud = { s: score, b: best, label, w1, bw, bt };
  }
  ctx.fillStyle = 'rgba(30,16,8,.78)'; rr(ctx, 14, 14, hud.bw, 38, 10); ctx.fill();
  ctx.strokeStyle = '#c98b2b'; ctx.lineWidth = 2; ctx.stroke();
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = '#f6e7c1'; ctx.font = 'bold 21px Georgia, serif'; ctx.fillText(hud.label, 28, 34);
  if (hud.bt){ ctx.fillStyle = 'rgba(246,231,193,.65)'; ctx.font = '13px Georgia, serif'; ctx.fillText(hud.bt, 28 + hud.w1 + 12, 35); }
}

function draw(){
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5)*shake*14, (Math.random() - .5)*shake*14);
  drawBackground();
  for (const g of gates){ const cv = gateCanvas(g); ctx.drawImage(cv, 0, snap(g.y - PAD_TOP), cv.width/DPR, cv.height/DPR); }
  drawParticles(true);
  if (state !== 'dying'){
    const sp = guitarSprite(cfg.guitar);
    ctx.save(); ctx.translate(gx, guitarY); ctx.rotate(tilt); ctx.drawImage(sp.c, -sp.size/2, -sp.size/2, sp.size, sp.size); ctx.restore();
  }
  drawParticles(false);
  ctx.restore();
  ctx.drawImage(over, 0, 0, over.width/DPR, over.height/DPR);
  if (flash > 0){ ctx.fillStyle = `rgba(200,40,30,${flash*.3})`; ctx.fillRect(0, 0, W, H); }
  drawHUD();
}

/* ============ Eingabe ============ */
let dragging = false, dragX = 0, dragT = 0;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('#overlay') || e.target.closest('#mute')) return;
  dragging = true; dragX = e.clientX; dragT = tx;
  if (e.pointerType === 'mouse') tx = clamp(e.clientX - stage.getBoundingClientRect().left, GM, W - GM);
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
});
stage.addEventListener('pointermove', e => {
  if (state !== 'play') return;
  if (e.pointerType === 'mouse') tx = clamp(e.clientX - stage.getBoundingClientRect().left, GM, W - GM);
  else if (dragging) tx = clamp(dragT + (e.clientX - dragX)*1.2, GM, W - GM);
});
const endDrag = () => { dragging = false; };
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
// Safari: kein Mitwackeln der Seite, kein Zoomen
stage.addEventListener('touchmove', e => { if (!e.target.closest('#overlay')) e.preventDefault(); }, { passive: false });
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});
btn.addEventListener('click', startGame);
muteBtn.addEventListener('click', () => {
  Snd.init(); Snd.setMuted(!Snd.muted); muteBtn.textContent = Snd.muted ? '🔇' : '🔊'; if (!Snd.muted) Snd.click();
});
window.addEventListener('resize', queueResize);
window.addEventListener('orientationchange', () => setTimeout(queueResize, 200));
stage.addEventListener('contextmenu', e => e.preventDefault());

/* ============ Bestenliste & Einstellungen ============ */
function renderBoard(hi, limit){
  const el = $('board');
  if (!board.length){ el.hidden = true; return; }
  el.hidden = false; el.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = 'Bestenliste'; el.appendChild(h);
  const ol = document.createElement('ol');
  board.slice(0, limit).forEach((e, i) => {
    const li = document.createElement('li'); if (i === hi) li.className = 'new';
    li.innerHTML = `<span class="r">${i + 1}.</span><span class="s">${e.s} ${e.s === 1 ? 'Tor' : 'Tore'}</span><span class="d">${e.d || ''}</span>`;
    ol.appendChild(li);
  });
  el.appendChild(ol);
}

const rlo = $('rlo'), rhi = $('rhi');
function refreshSettings(){
  const n = songPool().length, lo = posYear(cfg.lo), hi = posYear(cfg.hi);
  const full = cfg.lo === 0 && cfg.hi === RMAX;
  $('rangeTxt').textContent = `${lo} bis ${hi}`;
  $('sumTxt').textContent = `${GENRES.find(g => g[0] === cfg.genre)[1]}, ${full ? 'alle Jahre' : lo + ' bis ' + hi}, ${GUITARS[cfg.guitar].name}`;
  const cnt = $('cnt'); cnt.className = 'cnt' + (n < MIN_SONGS ? ' bad' : '');
  cnt.textContent = n < MIN_SONGS ? `Nur ${n} ${n === 1 ? 'Song' : 'Songs'}, bitte Auswahl erweitern` : `${n} Songs`;
  btn.disabled = n < MIN_SONGS;
  rlo.value = cfg.lo; rhi.value = cfg.hi;
  rlo.style.zIndex = cfg.lo > RMAX/2 ? 3 : 1; rhi.style.zIndex = 2;
  const f = $('rfill');
  f.style.left = `calc(13px + (100% - 26px) * ${cfg.lo / RMAX})`;
  f.style.width = `calc((100% - 26px) * ${(cfg.hi - cfg.lo) / RMAX})`;
  [...$('genres').children].forEach((b, i) => b.setAttribute('aria-pressed', String(GENRES[i][0] === cfg.genre)));
  [...$('picker').children].forEach((b, i) => b.setAttribute('aria-pressed', String(i === cfg.guitar)));
}
function saveCfg(){ try { localStorage.setItem('saitenflug_cfg', JSON.stringify(cfg)); } catch (e) {} }

function buildSettings(){
  const gen = $('genres');
  GENRES.forEach(([id, name]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = name;
    b.addEventListener('click', () => { cfg.genre = id; saveCfg(); refreshSettings(); });
    gen.appendChild(b);
  });
  rlo.addEventListener('input', () => { cfg.lo = Math.min(+rlo.value, cfg.hi); saveCfg(); refreshSettings(); });
  rhi.addEventListener('input', () => { cfg.hi = Math.max(+rhi.value, cfg.lo); saveCfg(); refreshSettings(); });
  const p = $('picker');
  GUITARS.forEach((G, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'gbtn';
    const c = document.createElement('canvas'); c.width = 80; c.height = 136;
    const g = c.getContext('2d'), s = 124 / (G.bottom - G.top);
    g.translate(40, 68); g.scale(s, s); g.translate(0, -(G.top + G.bottom) / 2); G.shape(g);
    const l = document.createElement('span'); l.textContent = G.name;
    b.append(c, l);
    b.addEventListener('click', () => {
      cfg.guitar = i; saveCfg(); Snd.init(); Snd.setVoice(i); Snd.start(); refreshSettings();
    });
    p.appendChild(b);
  });
}

/* ============ Start ============ */
buildSettings(); Snd.setVoice(cfg.guitar); refreshSettings(); renderBoard(-1, 3);
resize();
let last = 0, dtS = 1/60;
function frame(ts){
  requestAnimationFrame(frame);
  const idle = state === 'menu' || (state === 'dying' && overShown);
  if (idle && ts - last < 30) return;                 // hinter dem Overlay reichen 30 fps
  let dt = (ts - last)/1000; last = ts;
  if (!(dt > 0) || dt > .1) dt = 1/60;
  dt = Math.min(dt, .05); dtS += (dt - dtS)*.3;       // glättet Safaris unregelmäßige Frame-Zeiten
  update(dtS); draw();
}
requestAnimationFrame(frame);
})();
</script>
