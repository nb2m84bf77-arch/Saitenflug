<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Saitenflug</title>
<style>

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:#120a05;
    overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none}
  body{display:flex;justify-content:center;font-family:Georgia,'Times New Roman',serif;color:var(--ink)}
  #stage{position:relative;width:100%;max-width:520px;height:100%;touch-action:none;
    user-select:none;-webkit-user-select:none;overflow:hidden}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}

  #mute{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:40px;height:40px;
    border-radius:50%;border:2px solid var(--brass);background:rgba(30,16,8,.78);color:#f6e7c1;
    font-size:18px;cursor:pointer;z-index:5}
  #mute:focus-visible,#btn:focus-visible,#btnQuick:focus-visible{outline:3px solid #ffe29a;outline-offset:3px}

  #overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;justify-content:center;
    overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:14px 0;
    background:rgba(10,5,2,.5);z-index:4;opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .25s,visibility 0s .25s}
  #overlay.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .25s}
  .ticketWrap{width:min(92%,372px);margin:auto 0;flex:none}
  .tTop,.tStub{background:linear-gradient(170deg,var(--parch),var(--parch2));
    -webkit-mask-composite:source-in;mask-composite:intersect}
  .tTop{padding:18px 20px 14px;border-radius:12px 12px 0 0;
    -webkit-mask-image:radial-gradient(circle 12px at 0 100%,#0000 97%,#000),radial-gradient(circle 12px at 100% 100%,#0000 97%,#000);
    mask-image:radial-gradient(circle 12px at 0 100%,#0000 97%,#000),radial-gradient(circle 12px at 100% 100%,#0000 97%,#000)}
  .tStub{padding:14px 20px 16px;text-align:center;border-radius:0 0 12px 12px;
    border-top:2px dashed rgba(42,22,10,.4);background:linear-gradient(170deg,#e8d5a6,#d6bd86);
    -webkit-mask-image:radial-gradient(circle 12px at 0 0,#0000 97%,#000),radial-gradient(circle 12px at 100% 0,#0000 97%,#000);

  #stats{font-size:16px;line-height:1.4;margin-bottom:10px;font-weight:700}
  #stats span{display:block}
  #stats .small{font-size:13.5px;font-weight:400;opacity:.8}

  #board{margin-top:8px;font-size:14px}
  #board h2{font-size:14px;font-weight:700;margin-bottom:3px}
  #board ol{list-style:none}
  #board li{display:flex;gap:10px;padding:2px 4px;border-bottom:1px dotted rgba(42,22,10,.35)}
  #board li .r{width:18px}
  #board li .s{flex:1;font-weight:700}
  #board li .d{font-size:12.5px;opacity:.65}
  #board li.new{background:rgba(201,139,43,.4);border-radius:4px}
  #board h2 small{font-weight:400;font-size:12px;opacity:.7}
  .qbest{font-size:12.5px;opacity:.8;text-align:center}

  #settings{margin-top:10px;border-top:2px dashed rgba(42,22,10,.3);padding-top:8px}
  #settings summary{list-style:none;cursor:pointer;position:relative;padding-right:24px;font-weight:700;font-size:14px}
  #settings summary::-webkit-details-marker{display:none}
  #settings summary::after{content:'▾';position:absolute;right:2px;top:-1px;font-size:16px;transition:transform .2s}
  #settings[open] summary::after{transform:rotate(180deg)}
  #settings summary small{display:block;font-weight:400;font-size:12.5px;opacity:.7;margin-top:1px}
  #settings[open] summary small{display:none}
  .grp{margin-top:9px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px}
  .row2 .grp{margin-top:0;min-width:0}
  .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700;margin-bottom:4px}
  .lbl>span:last-child{font-weight:400}
  .seg{display:flex;border:2px solid rgba(42,22,10,.35);border-radius:9px;overflow:hidden}
  .seg .chip{flex:1;min-width:0;padding:6px 2px;font-size:12.5px;border:0;border-radius:0;background:rgba(255,255,255,.25)}
  .seg .chip+.chip{border-left:1px solid rgba(42,22,10,.25)}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chips .chip{flex:1 1 20%;padding:5px 4px;font-size:13px;text-align:center}
  .chip{font-family:inherit;color:var(--ink);cursor:pointer;border-radius:999px;
    background:rgba(255,255,255,.25);border:2px solid rgba(42,22,10,.3)}
  .chip[aria-pressed=true],.gbtn[aria-pressed=true]{border-color:var(--ink);background:rgba(201,139,43,.5);font-weight:700}
  .seg .chip[aria-pressed=true]{border-color:rgba(42,22,10,.25)}
  .chip:focus-visible,.gbtn:focus-visible{outline:3px solid #7a4f12;outline-offset:2px}

  #range{position:relative;height:28px}
  #range .rtrack{position:absolute;left:12px;right:12px;top:12px;height:4px;border-radius:2px;background:rgba(42,22,10,.25)}
  #range .rfill{position:absolute;top:12px;height:4px;border-radius:2px;background:var(--ink)}
  #range input{position:absolute;left:0;top:0;width:100%;height:28px;margin:0;background:none;
    -webkit-appearance:none;appearance:none;pointer-events:none;touch-action:none;outline:none}
  #range input::-webkit-slider-runnable-track{background:none;height:28px;border:0}
  #range input::-moz-range-track{background:none;border:0}
  #range input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;pointer-events:auto;width:24px;height:24px;
    margin-top:2px;border-radius:50%;border:2px solid var(--ink);background:linear-gradient(#f0b94d,#c98b2b);
    box-shadow:0 2px 0 #7a4f12;cursor:pointer}
  #range input::-moz-range-thumb{pointer-events:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);
    background:linear-gradient(#f0b94d,#c98b2b);box-shadow:0 2px 0 #7a4f12;cursor:pointer}
  .cnt{font-size:12.5px;margin-left:8px;opacity:.75}
  .cnt.bad{color:#8c1d12;opacity:1;font-weight:700}

  #picker{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .gbtn{font-family:inherit;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px 0;
    background:rgba(255,255,255,.25);border:2px solid rgba(42,22,10,.3);border-radius:8px}
  .gbtn canvas{position:static;width:30px;height:51px}

    #ovText{display:none}
    .tTop{padding-top:14px;padding-bottom:10px} .tStub{padding:10px 20px 12px}
    #settings{margin-top:6px} .grp,.row2{margin-top:6px}
    .chips .chip{padding:3px 4px} .seg .chip{padding:4px 2px}
    .gbtn canvas{width:25px;height:42px} h1{font-size:26px}
  }

  #btn,#btnQuick{font-family:inherit;font-size:19px;font-weight:700;color:var(--ink);cursor:pointer;
    padding:12px 30px;border-radius:8px;border:2px solid var(--ink);
    background:linear-gradient(#f0b94d,#c98b2b);box-shadow:0 4px 0 #7a4f12;transition:transform .08s,box-shadow .08s}
  #btn:active,#btnQuick:active{transform:translateY(3px);box-shadow:0 1px 0 #7a4f12}
  #btn:disabled,#btnQuick:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:0 4px 0 #7a4f12}
  .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .btns #btn,.btns #btnQuick{flex:1 1 0;min-width:0;padding:11px 6px;font-size:16px;white-space:nowrap}
  #btnQuick{color:#f6e7c1;background:linear-gradient(#5a3a22,#3a2314);box-shadow:0 4px 0 #1a0d05}
  #btnQuick:active{box-shadow:0 1px 0 #1a0d05}
  #btnQuick:disabled{box-shadow:0 4px 0 #1a0d05}

  #quick{position:absolute;top:0;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;gap:12px;
    padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));touch-action:manipulation}
  #quick[hidden]{display:none}
  .qTop{position:relative;display:flex;align-items:center;height:40px}
  .qScore{background:rgba(30,16,8,.78);border:2px solid var(--brass);border-radius:10px;padding:5px 12px;color:#f6e7c1;font-weight:700;font-size:18px}

    text-shadow:0 2px 0 rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
  .qTime.warn{color:#ff8f80}
  .qBar{height:8px;border-radius:4px;background:rgba(30,16,8,.7);overflow:hidden;border:1px solid rgba(201,139,43,.6)}
  .qBar i{display:block;height:100%;width:100%;background:linear-gradient(#f0b94d,#c98b2b);transform-origin:left center}
  .qCard{background:linear-gradient(170deg,#f6e9c6,#dcc58f);border:2px solid #5b3a1c;border-radius:10px;padding:16px 14px;
    text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.35)}
  .qTitle{font-style:italic;font-weight:700;font-size:clamp(20px,6vw,28px);line-height:1.15}
  .qSub{margin-top:6px;font-size:clamp(14px,4vw,18px);color:#5b3a1c}
  .qSub[hidden]{display:none}
  .qOpts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .qOpt{min-height:108px;min-width:0;font-family:inherit;font-weight:700;font-size:clamp(14px,4.3vw,19px);line-height:1.15;
    overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto;
    color:#f6e7c1;background:#2a170b;border:3px solid var(--brass);border-radius:12px;cursor:pointer;padding:8px 6px;
    box-shadow:0 4px 0 rgba(0,0,0,.45);touch-action:manipulation;-webkit-user-select:none;user-select:none}
  .qOpt:active{transform:translateY(2px)}
  .qOpt.ok{background:#25502b;border-color:#9be89b}
  .qOpt.bad{background:#5a1d17;border-color:#ff8f80}
  .qOpt.dim{opacity:.5}
  #quick.year .qOpt{font-size:clamp(20px,6.4vw,30px)}
  .ghost{display:block;margin:14px auto 0;padding:8px 12px;font-family:inherit;font-size:15px;font-weight:700;
    color:var(--ink);background:none;border:0;text-decoration:underline;cursor:pointer}
  .ghost[hidden]{display:none}
  .ghost:focus-visible{outline:3px solid #7a4f12;outline-offset:2px}
  @media (prefers-reduced-motion:reduce){#overlay{transition:none}}
</style>
</head>

<div id="stage">

      </div>
      <div class="tStub">
        <div id="stats" hidden></div>
        <div class="btns"><button id="btn">Losfliegen</button><button id="btnQuick">Schnelldurchlauf</button></div>
        <button id="btnMenu" class="ghost" hidden>Zum Menü</button>
      </div>
    </div>
  </div>
</div>

const MODES = ['Interpret', 'Jahr'];
const DIFFS = [
  { name: 'Leicht', s0: 115, sg: 4,   smax: 230, g0: 6,   gg: .12, gmin: 2.6, item: .55, spread: [12, 30] },
  { name: 'Mittel', s0: 140, sg: 5.5, smax: 300, g0: 5,   gg: .12, gmin: 1.6, item: .40, spread: [4, 12] },
  { name: 'Schwer', s0: 170, sg: 7,   smax: 340, g0: 4.2, gg: .13, gmin: 1.3, item: .28, spread: [2, 5] }
];
const GENRES = [['mix','Mix'],['r','Rock'],['p','Pop'],['d','Deutsch'],['h','Hip-Hop'],['x','Rap'],['k','Klassik']];
const RMAX = 166;                                   // Regler: 1500-1900 in 10er-Schritten, danach Jahr für Jahr
const posYear = p => p <= 40 ? 1500 + p*10 : 1900 + (p - 40);
const MIN_SONGS = 5;
const cfg = { mode: 0, diff: 1, genre: 'mix', lo: 0, hi: RMAX, guitar: 0, bg: 'auto' };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('saitenflug_cfg') || '{}')); } catch (e) {}
cfg.mode = cfg.mode === 1 ? 1 : 0;
cfg.diff = clamp(Math.round(+cfg.diff), 0, 2); if (!(cfg.diff >= 0)) cfg.diff = 1;
if (!GENRES.some(g => g[0] === cfg.genre)) cfg.genre = 'mix';
cfg.lo = clamp(Math.round(+cfg.lo) || 0, 0, RMAX); cfg.hi = clamp(Math.round(+cfg.hi) || RMAX, 0, RMAX);
if (cfg.lo > cfg.hi) cfg.lo = cfg.hi;

function songPool(){
  const lo = posYear(cfg.lo), hi = posYear(cfg.hi);
  return SONGS.filter(s => (cfg.genre === 'mix' || s.tags.includes(cfg.genre)) && s.year >= lo && s.year <= hi
    && (cfg.mode === 0 || (s.year >= 1800 && !YEAR_SKIP.has(s.title))));
}
const artistsOf = list => [...new Set(list.map(s => s.artist))];
function pickDecoys(song, pool){
  const lo = posYear(cfg.lo), hi = posYear(cfg.hi);
  const other = s => s.artist !== song.artist;
  const overlap = s => other(s) && [...s.tags].some(t => song.tags.includes(t));
  const yd = s => Math.abs(s.year - song.year);
  const take = names => shuffle(names).slice(0, 2);
  if (cfg.diff === 0){                               // leicht: weit weg (anderes Genre oder andere Epoche)
    let n = artistsOf(SONGS.filter(s => other(s) && ![...s.tags].some(t => song.tags.includes(t))));
    if (n.length < 2) n = artistsOf(SONGS.filter(s => other(s) && yd(s) >= 30));
    if (n.length >= 2) return take(n);
  } else if (cfg.diff === 2){                        // schwer: gleiche Epoche, gleiches Genre
    for (const r of [8, 15, 30]){
      const n = artistsOf(SONGS.filter(s => overlap(s) && yd(s) <= r));
      if (n.length >= 2) return take(n);
    }
  }
  const tiers = [
    () => pool.filter(overlap),
    () => SONGS.filter(s => overlap(s) && s.year >= lo - 25 && s.year <= hi + 25),
    () => SONGS.filter(overlap),
    () => SONGS.filter(other)
  ];
  for (const t of tiers){ const n = artistsOf(t()); if (n.length >= 2) return take(n); }
  return ['Unbekannt', 'Anonym'];
}
function pickYears(song){
  const [a, b] = DIFFS[cfg.diff].spread, k = song.year < 1900 ? 3 : 1, y = song.year;
  const sep = Math.max(2, Math.floor(a*k/2)), out = [];
  for (let i = 0; i < 300 && out.length < 2; i++){
    const mag = Math.round(rand(a*k, b*k)), yr = y + (Math.random() < .5 ? -mag : mag);
    if (yr < 1500 || yr > 2026) continue;
    if ([y, ...out].every(v => Math.abs(v - yr) >= sep)) out.push(yr);
  }
  for (let m = 1; out.length < 2; m++){ const yr = y + m*a*k; if (![y, ...out].includes(yr)) out.push(yr); }
  return out;
}

const TH = 960;
function floorStage(g){

    for (let k = 0; k < 26; k++){
      const gx = x + rnd()*pw, amp = 1 + rnd()*3, fr = 1 + Math.floor(rnd()*4), ph = rnd()*6.28;
      g.beginPath();
      for (let y = 0; y <= TH; y += 12){ const xx = gx + amp*Math.sin(ph + y/TH*Math.PI*2*fr); y ? g.lineTo(xx, y) : g.moveTo(xx, y); }
      g.strokeStyle = rnd() < .5 ? `rgba(0,0,0,${.06 + rnd()*.1})` : `rgba(255,200,130,${.03 + rnd()*.05})`;
      g.lineWidth = .6 + rnd()*1.4; g.stroke();
    }
    if (rnd() < .6){
      const kx = x + pw*(.25 + rnd()*.5), ky = 80 + rnd()*800;
      for (let r = 3; r < 13; r += 3){ g.beginPath(); g.ellipse(kx, ky, r*.7, r*1.5, 0, 0, 6.3); g.strokeStyle = `rgba(10,5,2,${.5 - r*.03})`; g.lineWidth = 1.2; g.stroke(); }
    }
    const j0 = 40 + rnd()*220, j1 = j0 + 440 + rnd()*60;
    [j0, j1].forEach(j => {
      g.fillStyle = 'rgba(8,4,2,.8)'; g.fillRect(x, j, pw, 2.5);
      g.fillStyle = 'rgba(255,200,130,.08)'; g.fillRect(x, j + 2.5, pw, 1);
      [x + 8, x + pw - 8].forEach(nx => {
        g.fillStyle = '#15100c'; g.beginPath(); g.arc(nx, j + 12, 1.8, 0, 6.3); g.fill();
        g.fillStyle = 'rgba(255,230,190,.25)'; g.beginPath(); g.arc(nx - .5, j + 11.4, .7, 0, 6.3); g.fill();
      });
    });
    g.fillStyle = 'rgba(5,2,1,.85)'; g.fillRect(x - .75, 0, 1.5, TH);
    g.fillStyle = 'rgba(255,200,130,.07)'; g.fillRect(x + 1.2, 0, 1, TH);
  }
}
function floorHall(g){
  const cols = Math.max(4, Math.round(W / 62)), cw = W / cols, rows = 2 * Math.max(2, Math.round(TH / cw / 2)), ch = TH / rows, rnd = mulberry(5);

function floorGarden(g){

  });

    T.side(g, H);
    const sg = g.createLinearGradient(13, 0, 40, 0); sg.addColorStop(0, 'rgba(0,0,0,.4)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sg; g.fillRect(13, 0, 27, H); g.restore();

function guitarSprite(type){
  const key = type + '@' + DPR; if (gSprites[key]) return gSprites[key];
  const G = GUITARS[type], s = 80 / (G.bottom - G.top), mid = (G.top + G.bottom) / 2, R = 90;
  const px = Math.ceil(2*R*s*DPR), c = document.createElement('canvas'); c.width = c.height = px;
  const g = c.getContext('2d'); g.setTransform(s*DPR, 0, 0, s*DPR, px/2, px/2); g.translate(0, -mid);
  g.fillStyle = radial(g, [[0, 'rgba(255,190,90,.20)'], [1, 'rgba(255,190,90,0)']], 0, mid, 4, R);
  g.fillRect(-R, mid - R, 2*R, 2*R);

  return gSprites[key] = { c, size: px / DPR };
}

  const entry = { s, t: Date.now(), d: new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' }) };

  const s = nextSong(); let opts, correct;
  if (cfg.mode === 0){ opts = shuffle([s.artist, ...pickDecoys(s, curPool)]); correct = opts.indexOf(s.artist); }
  else { const ys = [s.year, ...pickYears(s)].sort((a, b) => a - b); opts = ys.map(String); correct = ys.indexOf(s.year); }

/* ============ Text einpassen ============ */
function tokens(text){
  const out = [];
  text.split(' ').forEach(w => { const p = w.split('-'); p.forEach((x, i) => out.push({ t: i < p.length - 1 ? x + '-' : x, sp: i === 0 })); });
  return out;
}
function wrapLines(text, font, maxW){
  ctx.font = font; const lines = []; let cur = '';
  for (const k of tokens(text)){
    const t = cur ? cur + (k.sp ? ' ' : '') + k.t : k.t;
    if (!cur || ctx.measureText(t).width <= maxW) cur = t; else { lines.push(cur); cur = k.t; }
  }
  if (cur) lines.push(cur); return lines;
}
function trunc(l, maxW){
  if (ctx.measureText(l).width <= maxW) return l;
  while (l.length > 1 && ctx.measureText(l + '…').width > maxW) l = l.slice(0, -1);
  return l + '…';
}
function fit(text, maxW, maxH, maxLines, start, min, style){
  let font, lines;
  for (let s = start; s >= min; s--){
    font = `${style} ${s}px Georgia, 'Times New Roman', serif`; lines = wrapLines(text, font, maxW);
    if (lines.length <= maxLines && lines.every(l => ctx.measureText(l).width <= maxW) && lines.length*s*1.15 <= maxH)
      return { lines, size: s, font };
  }
  ctx.font = font; lines = lines.slice(0, maxLines).map(l => trunc(l, maxW));
  return { lines, size: min, font };
}
function drawLines(c, f, cx, cy){
  c.font = f.font; c.textAlign = 'center'; c.textBaseline = 'middle';
  f.lines.forEach((l, i) => c.fillText(l, cx, cy + (i - (f.lines.length - 1)/2) * f.size * 1.15));
}

}

/* ============ Schnelldurchlauf: 60 Sekunden, jede Antwort zählt nur wenn richtig ============ */
const QUICK_T = 60;
let quick = null, nowMs = 0;
const qEl = { root: $('quick'), score: $('qScore'), time: $('qTime'), bar: $('qBar'), title: $('qTitle'), sub: $('qSub'), opts: $('qOpts') };
const qBtns = [];
function buildQuick(){

    b.addEventListener('pointerdown', e => { e.preventDefault(); answerQuick(i); });
    b.addEventListener('click', e => { if (e.detail === 0) answerQuick(i); });

}
function startQuick(){
  curPool = songPool(); if (curPool.length < MIN_SONGS) return;
  Snd.init(); Snd.setVoice(cfg.guitar); Snd.start();
  if (isRandomBg()) applyTheme(resolveThemeId());
  prevBest = bestFor('quick'); best = prevBest; newIdx = -1; deck = [];
  gates.length = 0; items.length = 0; parts.length = 0; flash = 0; shake = 0;
  state = 'quick';
  quick = { endAt: nowMs + QUICK_T*1000, right: 0, wrong: 0, lock: false, unlockAt: 0, q: null, done: false, shownT: -1 };
  qEl.root.hidden = false; qEl.root.classList.toggle('year', cfg.mode === 1);
  qEl.score.textContent = '0'; qEl.time.textContent = String(QUICK_T); qEl.time.classList.toggle('warn', false);
  overlay.classList.remove('show');

}
function nextQuestion(){
  const q = makeQ(); quick.q = q; quick.lock = false;
  qEl.title.textContent = `„${q.title}“`;
  qEl.sub.hidden = q.mode !== 1; qEl.sub.textContent = q.mode === 1 ? q.artist : '';
  qBtns.forEach((b, i) => { b.textContent = q.opts[i]; b.className = 'qOpt'; });
}
function answerQuick(i){
  if (state !== 'quick' || !quick || quick.lock || quick.done) return;
  const q = quick.q, ok = i === q.correct; quick.lock = true;
  qBtns.forEach((b, k) => b.classList.add(k === q.correct ? 'ok' : k === i ? 'bad' : 'dim'));
  if (ok){ quick.right++; qEl.score.textContent = String(quick.right); Snd.tick(quick.right - 1); quick.unlockAt = nowMs + 160; }
  else { quick.wrong++; Snd.quickWrong(); quick.unlockAt = nowMs + 550; }
}
function tickQuick(){
  if (quick.done) return;
  const left = (quick.endAt - nowMs)/1000;
  if (quick.lock && nowMs >= quick.unlockAt && left > 0) nextQuestion();
  const sec = Math.max(0, Math.ceil(left));
  if (sec !== quick.shownT){ quick.shownT = sec; qEl.time.textContent = String(sec); qEl.time.classList.toggle('warn', sec <= 10); }
  qEl.bar.style.transform = `scaleX(${clamp(left / QUICK_T, 0, 1).toFixed(3)})`;
  if (left <= 0) endQuick();
}
function endQuick(){
  quick.done = true;
  const right = quick.right, wrong = quick.wrong, total = right + wrong;
  newIdx = addScore(right, 'quick'); if (right > best) best = right;

  showOverlay({

    stats: [`${right} richtig`, `${wrong} falsch, ${record ? 'Vorher: ' + prevBest : 'Bestwert: ' + best}`],
    hi: newIdx, kind: 'quick', quick: 'Nochmal', menu: true

function update(dt){
  time += dt;
  let v, dv;
  if (state === 'menu' || state === 'quick'){ v = 55; dv = v*dt; }
  else if (state === 'play'){
    const D = DIFFS[cfg.diff];
    speed = Math.min(D.s0 + score*D.sg, D.smax); gapT = Math.max(D.gmin, D.g0 - score*D.gg); v = speed;
    slowT = Math.max(0, slowT - dt); slowCur += ((slowT > 0 ? .55 : 1) - slowCur) * Math.min(1, dt*6);
    dv = v*dt*slowCur;
  } else { dieT += dt; v = speed * Math.max(.1, 1 - dieT*2.5); dv = v*dt; }
  scroll += dv;

  for (const d of decor) d.y += dv;
  while (decor.length && decor[0].y > H + 170) decor.shift();
  decorAcc += dv; if (decorAcc >= nextDecor){ decorAcc = 0; nextDecor = rand(150, 280); spawnDecor(-150); }
  for (const m of dust){ m.y += dv*m.s; if (m.y > H + 4){ m.y = -4; m.x = rand(0, W); } }
  for (const g of gates) g.y += dv;
  while (gates.length && gates[0].y > H + 20){ const g = gates.shift(); if (g.cv) gatePool.push(g.cv); }
  for (const it of items) it.y += dv;
  while (items.length && items[0].y > H + 60) items.shift();

  if (state === 'menu'){ gx = W/2 + Math.sin(time*1.2)*30; tilt = Math.cos(time*1.2)*.12; }
  else if (state === 'play'){
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir) tx += dir*540*dt;
    tx = clamp(tx, GM, W - GM);
    const prev = gx; gx += (tx - gx) * Math.min(1, dt*11);
    const vx = (gx - prev) / Math.max(dt, .001);
    tilt += (clamp(vx*.0018, -.45, .45) - tilt) * Math.min(1, dt*10);

    const spacing = speed * gapT;
    if (!gates.length || gates[gates.length-1].y >= spacing - GATE_TOTAL){
      gates.push(makeGate(-GATE_TOTAL)); spawnItem(-GATE_TOTAL, spacing);
    }
    for (let i = items.length - 1; i >= 0; i--){
      const it = items[i]; if (Math.hypot(it.x - gx, it.y - guitarY) < 40){ items.splice(i, 1); collect(it); }
    }
    for (const g of gates){ if (g.state === 'open' && g.y + GATE_FOCUS >= guitarY){ resolveGate(g); break; } }
  }
  if (state !== 'dying' && state !== 'quick'){
    trailT -= dt;
    if (trailT <= 0){ trailT = .09;
      note(gx + rand(-7, 7), guitarY + 32, rand(-12, 12), v*.7 + rand(0, 30), { life: .9, size: rand(12, 20), color: Math.random() < .5 ? '#f6e7c1' : '#f2b441', back: true }); }
  }
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i]; p.life -= dt; if (p.life <= 0){ parts.splice(i, 1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += p.g*dt; p.rot += p.vr*dt;
  }
  shake = Math.max(0, shake - dt*2.2); flash = Math.max(0, flash - dt*2.5);
  if (state === 'dying' && !overShown && dieT > 1.2) showGameOver();
  if (state === 'quick' && quick) tickQuick();
}

function renderGate(c, g){
  const lw = W/3, y = 0, yearMode = g.mode === 1;
  if (!g.fit || g.fit.w !== W){
    const bw = W - 28, sw = lw - 24, tw = bw - 52;
    g.fit = { w: W,
      title: yearMode ? fit(`„${g.title}“`, tw, 24, 1, 20, 11, 'italic bold') : fit(`„${g.title}“`, tw, BANNER_H - 10, 2, 22, 12, 'italic bold'),
      sub: yearMode ? fit(g.artist, tw, 18, 1, 14, 10, 'normal') : null,
      opts: g.opts.map(o => yearMode ? fit(o, sw - 14, 40, 1, 30, 14, 'bold') : fit(o, sw - 18, 66, 3, 18, 10, 'bold')) };
  }
  const y1 = y + GATE_Y1;
  // Torbereich (Glow der Gassen)
  for (let i = 0; i < 3; i++){
    let top = 'rgba(255,196,110,.17)', bot = 'rgba(255,196,110,.04)';
    if (g.state !== 'open'){
      if (i === g.correct){ top = 'rgba(100,215,110,.34)'; bot = 'rgba(100,215,110,.08)'; }
      else if (i === g.chosen){ top = 'rgba(230,70,55,.4)'; bot = 'rgba(230,70,55,.1)'; }
    }
    const gr = c.createLinearGradient(0, y1, 0, y1 + GATE_H); gr.addColorStop(0, top); gr.addColorStop(1, bot);
    c.fillStyle = gr; c.fillRect(i*lw, y1, lw, GATE_H);
  }
  const lg = c.createLinearGradient(0, y1 - 4, 0, y1 + 8); lg.addColorStop(0, '#74492a'); lg.addColorStop(1, '#3a2212');
  c.fillStyle = lg; c.fillRect(0, y1 - 4, W, 12);
  c.fillStyle = 'rgba(201,139,43,.8)'; c.fillRect(0, y1 - 4, W, 1.5);
  // Schilder
  for (let i = 0; i < 3; i++){
    const sx = i*lw + 12, sw = lw - 24, sy = y1 + 16, sh = GATE_H - 32;
    const dead = g.dead === i && g.state === 'open';
    let fill = '#2a170b', stroke = '#c98b2b', alpha = dead ? .3 : 1;
    if (g.state !== 'open'){
      if (i === g.correct){ fill = '#25502b'; stroke = '#9be89b'; }
      else if (i === g.chosen){ fill = '#5a1d17'; stroke = '#ff8f80'; }
      else alpha = .5;
    }
    c.globalAlpha = alpha;
    c.strokeStyle = '#1a0e06'; c.lineWidth = 1.5;
    [sx + 14, sx + sw - 14].forEach(x => { c.beginPath(); c.moveTo(x, y1 + 6); c.lineTo(x, sy + 2); c.stroke(); });
    c.fillStyle = 'rgba(0,0,0,.4)'; rr(c, sx + 2, sy + 4, sw, sh, 7); c.fill();
    c.fillStyle = fill; rr(c, sx, sy, sw, sh, 7); c.fill();
    c.strokeStyle = stroke; c.lineWidth = 2.5; c.stroke();
    c.fillStyle = '#f6e7c1'; drawLines(c, g.fit.opts[i], sx + sw/2, sy + sh/2 + 1);
    c.globalAlpha = 1;
    if (dead){
      c.strokeStyle = 'rgba(225,70,55,.95)'; c.lineWidth = 4; c.lineCap = 'round';
      c.beginPath(); c.moveTo(sx + 14, sy + 14); c.lineTo(sx + sw - 14, sy + sh - 14); c.moveTo(sx + sw - 14, sy + 14); c.lineTo(sx + 14, sy + sh - 14); c.stroke();
      c.lineCap = 'butt';
    }
  }
  // Pfosten = Gitarrenhälse
  for (let i = 0; i < 4; i++){
    const px = i*lw, top = y1 - 8, hgt = GATE_H + 12;
    c.fillStyle = '#5a371d'; c.fillRect(px - 7, top, 14, hgt);
    c.fillStyle = '#24120a'; c.fillRect(px - 4.5, top + 4, 9, hgt - 4);
    c.fillStyle = 'rgba(214,170,90,.85)';
    for (let fy = top + 14; fy < top + hgt; fy += 14) c.fillRect(px - 4.5, fy, 9, 1.3);
    c.fillStyle = '#c98b2b'; c.beginPath(); c.arc(px, top - 1, 5.5, 0, 6.3); c.fill();
    c.strokeStyle = '#2a160a'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = 'rgba(255,240,200,.5)'; c.beginPath(); c.arc(px - 1.5, top - 2.5, 1.5, 0, 6.3); c.fill();
  }
  // Banner UNTER dem Tor
  const bx = 14, bw = W - 28, by = y + BANNER_Y, bh = BANNER_H;
  c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath();
  c.moveTo(bx+3, by+6); c.lineTo(bx+bw+3, by+6); c.lineTo(bx+bw-7, by+bh/2+6); c.lineTo(bx+bw+3, by+bh+6); c.lineTo(bx+3, by+bh+6); c.lineTo(bx+13, by+bh/2+6); c.fill();
  const bg = c.createLinearGradient(0, by, 0, by + bh); bg.addColorStop(0, '#f6e9c6'); bg.addColorStop(1, '#dcc58f');
  c.fillStyle = bg; c.beginPath();
  c.moveTo(bx, by); c.lineTo(bx+bw, by); c.lineTo(bx+bw-10, by+bh/2); c.lineTo(bx+bw, by+bh); c.lineTo(bx, by+bh); c.lineTo(bx+10, by+bh/2); c.closePath();
  c.fill(); c.strokeStyle = '#5b3a1c'; c.lineWidth = 2; c.stroke();
  c.fillStyle = '#c98b2b'; [[bx + 18, by + 8], [bx + bw - 18, by + 8]].forEach(([nx, ny]) => { c.beginPath(); c.arc(nx, ny, 2.4, 0, 6.3); c.fill(); });
  c.fillStyle = '#2a160a';
  if (yearMode){ drawLines(c, g.fit.title, W/2, by + 19); c.fillStyle = '#5b3a1c'; drawLines(c, g.fit.sub, W/2, by + 38); }
  else drawLines(c, g.fit.title, W/2, by + bh/2 + 1);
}
const GATE_CH = PAD_TOP + GATE_TOTAL + 8;
function gateCanvas(g){
  if (!g.cv) g.cv = document.createElement('canvas');
  const w = Math.ceil(W*DPR), h = Math.ceil(GATE_CH*DPR);
  if (g.cv.width !== w || g.cv.height !== h){ g.cv.width = w; g.cv.height = h; g.dirty = true; }
  if (g.dirty){
    const c = g.cv.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, W, GATE_CH);
    c.save(); c.translate(0, PAD_TOP); renderGate(c, g); c.restore(); g.dirty = false;
  }

function drawParticles(back){

        else ctx.font = `${p.size}px serif`;

function draw(){
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5)*shake*14, (Math.random() - .5)*shake*14);
  drawBackground();
  for (const g of gates){ const cv = gateCanvas(g); ctx.drawImage(cv, 0, snap(g.y - PAD_TOP), cv.width/DPR, cv.height/DPR); }
  drawItems();
  drawParticles(true);
  if (state !== 'dying' && state !== 'quick'){
    const sp = guitarSprite(cfg.guitar);
    ctx.save(); ctx.translate(gx, guitarY); ctx.rotate(tilt); ctx.drawImage(sp.c, -sp.size/2, -sp.size/2, sp.size, sp.size); ctx.restore();
  }
  drawParticles(false);
  ctx.restore();
  ctx.drawImage(over, 0, 0, over.width/DPR, over.height/DPR);
  if (slowCur < .95){ ctx.fillStyle = `rgba(120,170,255,${((1 - slowCur)*.22).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
  if (flash > 0){ ctx.fillStyle = `rgba(200,40,30,${flash*.3})`; ctx.fillRect(0, 0, W, H); }
  drawHUD();
}

/* ============ Eingabe ============ */
let dragging = false, dragX = 0, dragT = 0;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('#overlay') || e.target.closest('#mute') || e.target.closest('#quick')) return;
  dragging = true; dragX = e.clientX; dragT = tx;
  if (e.pointerType === 'mouse') tx = clamp(e.clientX - stage.getBoundingClientRect().left, GM, W - GM);
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
});
stage.addEventListener('pointermove', e => {
  if (state !== 'play') return;
  if (e.pointerType === 'mouse') tx = clamp(e.clientX - stage.getBoundingClientRect().left, GM, W - GM);
  else if (dragging) tx = clamp(dragT + (e.clientX - dragX)*1.2, GM, W - GM);
});
const endDrag = () => { dragging = false; };
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('touchmove', e => { if (!e.target.closest('#overlay')) e.preventDefault(); }, { passive: false });
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if (state === 'quick' && e.key >= '1' && e.key <= '3') answerQuick(+e.key - 1);
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});
btn.addEventListener('click', startGame);
btnQuick.addEventListener('click', startQuick);
$('btnMenu').addEventListener('click', goToMenu);
muteBtn.addEventListener('click', () => {
  Snd.init(); Snd.setMuted(!Snd.muted); muteBtn.textContent = Snd.muted ? '🔇' : '🔊'; if (!Snd.muted) Snd.click();
});
window.addEventListener('resize', queueResize);
window.addEventListener('orientationchange', () => setTimeout(queueResize, 200));
stage.addEventListener('contextmenu', e => e.preventDefault());

/* ============ Bestenliste & Einstellungen ============ */
function renderBoard(hi){
  const el = $('board'); el.innerHTML = '';
  if (boardCompact){
    const f = bestFor('fly'), q = bestFor('quick'), parts = [];
    if (f) parts.push(`Flug ${f}`); if (q) parts.push(`Schnelldurchlauf ${q}`);
    if (!parts.length){ el.hidden = true; return; }
    const p = document.createElement('p'); p.className = 'qbest'; p.textContent = 'Bestwerte: ' + parts.join(', ');
    el.hidden = false; el.appendChild(p); return;
  }
  const list = boardList(boardKind), quickMode = boardKind === 'quick';
  if (!list.length){ el.hidden = true; return; }
  el.hidden = false;
  const h = document.createElement('h2'); h.textContent = quickMode ? 'Bestenliste Schnelldurchlauf ' : 'Bestenliste ';
  const sm = document.createElement('small'); sm.textContent = `(${MODES[cfg.mode]}, ${DIFFS[cfg.diff].name})`; h.appendChild(sm); el.appendChild(h);
  const ol = document.createElement('ol');
  list.slice(0, boardLimit).forEach((e, i) => {
    const li = document.createElement('li'); if (i === hi) li.className = 'new';
    const unit = quickMode ? 'richtig' : (e.s === 1 ? 'Tor' : 'Tore');
    li.innerHTML = `<span class="r">${i + 1}.</span><span class="s">${e.s} ${unit}</span><span class="d">${e.d || ''}</span>`;
    ol.appendChild(li);
  });
  el.appendChild(ol);
}

const rlo = $('rlo'), rhi = $('rhi');
function refreshSettings(){
  const n = songPool().length, lo = posYear(cfg.lo), hi = posYear(cfg.hi);
  const full = cfg.lo === 0 && cfg.hi === RMAX;
  $('rangeTxt').textContent = `${lo} bis ${hi}`;
  $('sumTxt').textContent = `${MODES[cfg.mode]}, ${DIFFS[cfg.diff].name}, ${GENRES.find(g => g[0] === cfg.genre)[1]}, ${full ? 'alle Jahre' : lo + ' bis ' + hi}, ${GUITARS[cfg.guitar].name}`;
  const cnt = $('cnt'); cnt.className = 'cnt' + (n < MIN_SONGS ? ' bad' : '');
  cnt.textContent = n < MIN_SONGS ? `Nur ${n} ${n === 1 ? 'Song' : 'Songs'}, bitte Auswahl erweitern` : `${n} Songs`;
  btn.disabled = btnQuick.disabled = n < MIN_SONGS;
  rlo.value = cfg.lo; rhi.value = cfg.hi;
  rlo.style.zIndex = cfg.lo > RMAX/2 ? 3 : 1; rhi.style.zIndex = 2;
  const f = $('rfill');
  f.style.left = `calc(12px + (100% - 24px) * ${cfg.lo / RMAX})`;
  f.style.width = `calc((100% - 24px) * ${(cfg.hi - cfg.lo) / RMAX})`;
  $('gname').textContent = GUITARS[cfg.guitar].name;
  const press = (id, test) => [...$(id).children].forEach((b, i) => b.setAttribute('aria-pressed', String(test(i))));
  press('modes', i => i === cfg.mode); press('diffs', i => i === cfg.diff);
  press('genres', i => GENRES[i][0] === cfg.genre); press('picker', i => i === cfg.guitar);
  press('bgs', i => BG_OPTS[i][0] === cfg.bg);
  if (state === 'menu') $('ovText').textContent = menuText();
  renderBoard(-1);
}
function saveCfg(){ try { localStorage.setItem('saitenflug_cfg', JSON.stringify(cfg)); } catch (e) {} }
const BG_OPTS = [['auto', 'Auto'], ['rand', 'Zufall'], ...Object.values(THEMES).map(t => [t.id, t.name])];
function onCfg(kind){
  saveCfg();
  if (kind === 'genre' || kind === 'bg') applyTheme(resolveThemeId());
  refreshSettings();
}
function chipRow(id, labels, onPick){
  const row = $(id);
  labels.forEach((name, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = name;
    b.addEventListener('click', () => onPick(i)); row.appendChild(b);
  });
}
function buildSettings(){
  chipRow('modes', MODES, i => { cfg.mode = i; onCfg('mode'); });
  chipRow('diffs', DIFFS.map(d => d.name), i => { cfg.diff = i; onCfg('diff'); });
  chipRow('genres', GENRES.map(g => g[1]), i => { cfg.genre = GENRES[i][0]; onCfg('genre'); });
  chipRow('bgs', BG_OPTS.map(b => b[1]), i => { cfg.bg = BG_OPTS[i][0]; onCfg('bg'); });
  rlo.addEventListener('input', () => { cfg.lo = Math.min(+rlo.value, cfg.hi); onCfg('range'); });
  rhi.addEventListener('input', () => { cfg.hi = Math.max(+rhi.value, cfg.lo); onCfg('range'); });
  const p = $('picker');
  GUITARS.forEach((G, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'gbtn';
    const c = document.createElement('canvas'); c.width = 80; c.height = 136;
    const g = c.getContext('2d'), s = 124 / (G.bottom - G.top);
    g.translate(40, 68); g.scale(s, s); g.translate(0, -(G.top + G.bottom) / 2); G.shape(g);
    b.setAttribute('aria-label', G.name); b.title = G.name; b.append(c);
    b.addEventListener('click', () => { cfg.guitar = i; Snd.init(); Snd.setVoice(i); Snd.start(); onCfg('guitar'); });
    p.appendChild(b);
  });
}

/* ============ Start ============ */
curTheme = THEMES[resolveThemeId()];
buildSettings(); buildQuick(); Snd.setVoice(cfg.guitar); $('ovText').textContent = menuText(); refreshSettings();
resize();
let last = 0, dtS = 1/60;
function frame(ts){
  requestAnimationFrame(frame);
  nowMs = ts;
  const idle = state === 'menu' || state === 'quick' || (state === 'dying' && overShown);
  if (idle && ts - last < 30) return;
  let dt = (ts - last)/1000; last = ts;
  if (!(dt > 0) || dt > .1) dt = 1/60;
  dt = Math.min(dt, .05); dtS += (dt - dtS)*.3;
  update(dtS); draw();
}
requestAnimationFrame(frame);
})();
</script>
