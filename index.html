<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Saitenflug</title>
<style>
  :root{--ink:#2a160a;--parch:#f1e2bd;--parch2:#e0cb98;--brass:#c98b2b}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#120a05;overflow:hidden;overscroll-behavior:none}
  body{display:flex;justify-content:center;font-family:Georgia,'Times New Roman',serif;color:var(--ink)}
  #stage{position:relative;width:100%;max-width:520px;height:100vh;height:100dvh;touch-action:none;
    user-select:none;-webkit-user-select:none;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  #mute{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:40px;height:40px;
    border-radius:50%;border:2px solid var(--brass);background:rgba(30,16,8,.78);color:#f6e7c1;
    font-size:18px;cursor:pointer;z-index:5}
  #mute:focus-visible,#btn:focus-visible{outline:3px solid #ffe29a;outline-offset:3px}

  #overlay{position:absolute;inset:0;display:flex;justify-content:center;overflow-y:auto;touch-action:pan-y;
    padding:14px 0;background:rgba(10,5,2,.5);z-index:4;opacity:0;pointer-events:none;transition:opacity .25s}
  #overlay.show{opacity:1;pointer-events:auto}
  .ticketWrap{width:min(88%,350px);margin:auto 0;flex:none;filter:drop-shadow(0 12px 20px rgba(0,0,0,.65));
    transform:translateY(8px);transition:transform .3s}
  #overlay.show .ticketWrap{transform:none}
  .tTop,.tStub{background:linear-gradient(170deg,var(--parch),var(--parch2));
    -webkit-mask-composite:source-in;mask-composite:intersect}
  .tTop{padding:24px 20px 18px;border-radius:12px 12px 0 0;
    -webkit-mask-image:radial-gradient(circle 12px at 0 100%,#0000 97%,#000),radial-gradient(circle 12px at 100% 100%,#0000 97%,#000);
    mask-image:radial-gradient(circle 12px at 0 100%,#0000 97%,#000),radial-gradient(circle 12px at 100% 100%,#0000 97%,#000)}
  .tStub{padding:18px 24px 22px;text-align:center;border-radius:0 0 12px 12px;
    border-top:2px dashed rgba(42,22,10,.4);background:linear-gradient(170deg,#e8d5a6,#d6bd86);
    -webkit-mask-image:radial-gradient(circle 12px at 0 0,#0000 97%,#000),radial-gradient(circle 12px at 100% 0,#0000 97%,#000);
    mask-image:radial-gradient(circle 12px at 0 0,#0000 97%,#000),radial-gradient(circle 12px at 100% 0,#0000 97%,#000)}
  h1{font-size:40px;line-height:1.05;font-weight:700;letter-spacing:.5px;margin-bottom:10px}
  #ovText{font-size:16px;line-height:1.45}
  #ovHint{font-size:13px;line-height:1.4;margin-top:10px;opacity:.7}
  #stats{font-size:17px;line-height:1.5;margin-bottom:12px;font-weight:700}
  #stats span{display:block}
  #stats .small{font-size:14px;font-weight:400;opacity:.8}
  #years{margin-top:14px}
  .yhead{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;font-weight:700}
  .yhead small{font-size:13px;font-weight:400;opacity:.7}
  .range{position:relative;height:32px;margin-top:4px}
  .range .track,.range .fill{position:absolute;top:14px;height:4px;border-radius:2px}
  .range .track{left:0;right:0;background:rgba(42,22,10,.3)}
  .range .fill{background:var(--ink)}
  .range input{position:absolute;left:0;top:0;width:100%;height:32px;margin:0;background:none;
    -webkit-appearance:none;appearance:none;pointer-events:none;outline:none}
  .range input::-webkit-slider-runnable-track{background:none;height:32px}
  .range input::-moz-range-track{background:none;height:32px}
  .range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:26px;height:26px;margin-top:3px;
    border-radius:50%;border:2px solid var(--ink);background:linear-gradient(#f0b94d,#c98b2b);box-shadow:0 2px 0 #7a4f12;cursor:pointer}
  .range input::-moz-range-thumb{pointer-events:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);
    background:#e0a23a;box-shadow:0 2px 0 #7a4f12;cursor:pointer}
  .range input:focus-visible::-webkit-slider-thumb{outline:3px solid #7a4f12;outline-offset:2px}
  .range input:focus-visible::-moz-range-thumb{outline:3px solid #7a4f12;outline-offset:2px}
  #board{margin-top:14px;font-size:15px}
  #board h2{font-size:15px;font-weight:700;margin-bottom:3px}
  #board ol{list-style:none}
  #board li{display:flex;gap:10px;padding:2px 4px;border-bottom:1px dotted rgba(42,22,10,.35)}
  #board li .r{width:18px}
  #board li .s{flex:1;font-weight:700}
  #board li .y{font-size:13px;opacity:.65}
  #board li .d{font-size:13px;opacity:.65;min-width:56px;text-align:right}
  #board li.new{background:rgba(201,139,43,.4);border-radius:4px}
  #picker{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
  .gbtn{font-family:inherit;color:var(--ink);font-size:12px;line-height:1.1;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;
    background:rgba(255,255,255,.25);border:2px solid rgba(42,22,10,.3);border-radius:10px}
  .gbtn canvas{position:static;width:36px;height:61px}
  .gbtn[aria-pressed=true]{border-color:var(--ink);background:rgba(201,139,43,.4);font-weight:700}
  .gbtn:focus-visible{outline:3px solid #7a4f12;outline-offset:2px}
  #btn{font-family:inherit;font-size:19px;font-weight:700;color:var(--ink);cursor:pointer;
    padding:12px 30px;border-radius:8px;border:2px solid var(--ink);
    background:linear-gradient(#f0b94d,#c98b2b);box-shadow:0 4px 0 #7a4f12;transition:transform .08s,box-shadow .08s}
  #btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a4f12}
  @media (prefers-reduced-motion:reduce){#overlay,.ticketWrap{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <button id="mute" aria-label="Ton an oder aus">🔊</button>
  <div id="overlay" class="show">
    <div class="ticketWrap">
      <div class="tTop">
        <h1 id="ovTitle">Saitenflug</h1>
        <p id="ovText">Flieg durch das Tor mit dem richtigen Interpreten.</p>
        <div id="years">
          <div class="yhead"><span id="yLabel">1950 – 2026</span><small id="yCount"></small></div>
          <div class="range">
            <div class="track"></div><div class="fill" id="yFill"></div>
            <input type="range" id="yFrom" min="1950" max="2026" step="1" value="1950" aria-label="Von Jahr">
            <input type="range" id="yTo" min="1950" max="2026" step="1" value="2026" aria-label="Bis Jahr">
          </div>
        </div>
        <div id="picker" role="group" aria-label="Gitarre wählen"></div>
        <div id="board" hidden></div>
        <p id="ovHint" hidden></p>
      </div>
      <div class="tStub">
        <div id="stats" hidden></div>
        <button id="btn">Losfliegen</button>
      </div>
    </div>
  </div>
</div>

function poolFor(a, b){
  const inR = (lo, hi) => SONGS.filter(s => s[2] >= lo && s[2] <= hi);
  const count = inR(a, b).length; let lo = a, hi = b, p = inR(lo, hi), widened = false;
  while (p.length < 8 && (lo > YMIN || hi < YMAX)){ lo = Math.max(YMIN, lo - 1); hi = Math.min(YMAX, hi + 1); p = inR(lo, hi); widened = true; }
  return { pool: p, count, widened };
}

const Snd = {
  ctx: null, master: null, noise: null, muted: false,
  voice: { mul: 1, bright: 9, wave: 'sawtooth', gain: 1 },
  setVoice(i){ const G = GUITARS[i]; this.voice = { mul: G.mul, bright: G.bright, wave: G.wave, gain: G.gain }; },
  init(){
    if (this.ctx){ if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.8;
    this.master.connect(this.ctx.destination);
    const len = this.ctx.sampleRate; const b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = b.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random()*2-1; this.noise = b;
  },
  setMuted(m){ this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.8; },
  pluck(freq, delay = 0, vol = .25, dur = .9){
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + delay;
    const v = this.voice; freq *= v.mul; vol *= v.gain;
    const o1 = c.createOscillator(), o2 = c.createOscillator();
    o1.type = v.wave; o2.type = 'triangle';
    o1.frequency.value = freq; o2.frequency.value = freq * 2.004;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 1;
    f.frequency.setValueAtTime(freq * v.bright, t); f.frequency.exponentialRampToValueAtTime(freq * 1.2, t + dur * .6);
    const g = c.createGain(); g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    const g2 = c.createGain(); g2.gain.value = .35;
    o1.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(this.master);
    o1.start(t); o2.start(t); o1.stop(t + dur + .05); o2.stop(t + dur + .05);
  },
  burst(delay, dur, vol, freq, type = 'bandpass'){
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.noise;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = .8;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + .05);
  },
  thud(delay = 0){
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(38, t + .35);
    const g = c.createGain(); g.gain.setValueAtTime(.6, t); g.gain.exponentialRampToValueAtTime(.0001, t + .4);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + .45);
  },

  },

  },
  click(){ this.pluck(660, 0, .12, .25); }

const TH = 960;
function makeWood(){
  const c = document.createElement('canvas'); c.width = Math.ceil(W * DPR); c.height = Math.ceil(TH * DPR);
  const g = c.getContext('2d'); g.scale(DPR, DPR);
  const n = Math.max(4, Math.round(W / 92)), pw = W / n, rnd = mulberry(11);
  for (let i = 0; i < n; i++){
    const x = i * pw;
    g.fillStyle = `hsl(${21 + rnd()*9} 42% ${16 + rnd()*7}%)`; g.fillRect(x, 0, pw, TH);
    for (let k = 0; k < 26; k++){
      const gx = x + rnd()*pw, amp = 1 + rnd()*3, fr = 1 + Math.floor(rnd()*4), ph = rnd()*6.28;
      g.beginPath();
      for (let y = 0; y <= TH; y += 12){ const xx = gx + amp*Math.sin(ph + y/TH*Math.PI*2*fr); y ? g.lineTo(xx, y) : g.moveTo(xx, y); }
      g.strokeStyle = rnd() < .5 ? `rgba(0,0,0,${.06 + rnd()*.1})` : `rgba(255,200,130,${.03 + rnd()*.05})`;
      g.lineWidth = .6 + rnd()*1.4; g.stroke();
    }
    if (rnd() < .6){ // Astloch
      const kx = x + pw*(.25 + rnd()*.5), ky = 80 + rnd()*800;
      for (let r = 3; r < 13; r += 3){ g.beginPath(); g.ellipse(kx, ky, r*.7, r*1.5, 0, 0, 6.3); g.strokeStyle = `rgba(10,5,2,${.5 - r*.03})`; g.lineWidth = 1.2; g.stroke(); }
    }
    const j0 = 40 + rnd()*220, j1 = j0 + 440 + rnd()*60;
    [j0, j1].forEach(j => {
      g.fillStyle = 'rgba(8,4,2,.8)'; g.fillRect(x, j, pw, 2.5);
      g.fillStyle = 'rgba(255,200,130,.08)'; g.fillRect(x, j + 2.5, pw, 1);

function nextSong(){ if (!deck.length) deck = shuffle(activePool.slice()); return deck.pop(); }
function makeGate(y){
  const [title, artist, year] = nextSong();
  let cand = shuffle(activeArtists.filter(a => a !== artist && !related(a, artist)));
  if (cand.length < 2) cand = cand.concat(shuffle(ALL_ARTISTS.filter(a => a !== artist && !related(a, artist) && !cand.includes(a))));
  const opts = shuffle([artist, ...cand.slice(0, 2)]);
  return { y, title, artist, year, opts, correct: opts.indexOf(artist), state: 'open', chosen: -1, fit: null };
}
/* Zeit zwischen den Toren: startet bei 5 s und wird bis ca. 1,7 s kürzer */
const interval = () => Math.max(1.7, 5 - score * .1);
const spacing = () => interval() * speed;

function spawnDecor(y){
  let type; do { type = DECOR_TYPES[Math.floor(Math.random()*DECOR_TYPES.length)]; } while (type === lastDecorType);
  lastDecorType = type;
  const size = rand(70, 130);
  decor.push({ type, size, x: rand(-size*.2, W - size*.8), y, rot: rand(-.5, .5) });
}

function resize(){
  const r = stage.getBoundingClientRect(); const oldW = W;
  W = r.width; H = r.height; DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  wood = makeWood(); guitarY = H*.77;
  if (oldW){ gx *= W/oldW; tx *= W/oldW; } else { gx = tx = W/2;
    for (let y = -100; y < H; y += 190) spawnDecor(y);
    for (let i = 0; i < 40; i++) dust.push({ x: rand(0, W), y: rand(0, H), r: rand(.6, 2), s: rand(.5, 1.6), a: rand(.12, .35) });
  }
}

/* ============ Text einpassen ============ */
function wrapLines(text, font, maxW){
  ctx.font = font; const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words){ const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; } }
  if (cur) lines.push(cur); return lines;
}
function fit(text, maxW, maxH, maxLines, start, min, style){
  let font, lines;
  for (let s = start; s >= min; s--){
    font = `${style} ${s}px Georgia, 'Times New Roman', serif`; lines = wrapLines(text, font, maxW);
    if (lines.length <= maxLines && lines.every(l => ctx.measureText(l).width <= maxW) && lines.length*s*1.15 <= maxH)
      return { lines, size: s, font };
  }
  return { lines, size: min, font };
}
function drawLines(f, cx, cy){
  ctx.font = f.font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  f.lines.forEach((l, i) => ctx.fillText(l, cx, cy + (i - (f.lines.length - 1)/2) * f.size * 1.15));
}

/* ============ Partikel ============ */
function note(x, y, vx, vy, o = {}){
  parts.push({ type: 'note', x, y, vx, vy, g: o.g || 0, life: o.life || 1, max: o.life || 1,
    size: o.size || 16, ch: o.ch || (Math.random() < .5 ? '♪' : '♫'), color: o.color || '#f2c46a',
    rot: rand(-.5, .5), vr: rand(-1.5, 1.5), back: o.back });
}
function burst(x, y){
  for (let i = 0; i < 12; i++){ const a = rand(0, 6.28), s = rand(60, 220);
    note(x, y, Math.cos(a)*s, Math.sin(a)*s - 40, { life: rand(.7, 1.2), size: rand(16, 28), g: 60, color: Math.random() < .5 ? '#ffe29a' : '#f2b441' }); }
  for (let i = 0; i < 14; i++){ const a = rand(0, 6.28), s = rand(80, 260);
    parts.push({ type: 'dot', x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, g: 120, life: rand(.4, .8), max: .8, size: rand(1.5, 3.5), color: '#ffe9b0', rot: 0, vr: 0 }); }
  parts.push({ type: 'text', x, y: y - 40, vx: 0, vy: -70, g: 0, life: .9, max: .9, size: 26, ch: '+1', color: '#ffe29a', rot: 0, vr: 0 });
}
function debris(x, y){
  const cols = ['#c8721f', '#6a2a0e', '#2a160a', '#e6c487'];
  for (let i = 0; i < 30; i++){
    parts.push({ type: 'chip', x: x + rand(-8, 8), y: y + rand(-30, 30), vx: rand(-240, 240), vy: rand(-340, -30), g: 760,
      life: rand(.8, 1.4), max: 1.4, size: rand(3, 7), color: cols[i % 4], rot: rand(0, 6), vr: rand(-12, 12) });
  }
  for (let i = 0; i < 6; i++) note(x, y, rand(-120, 120), rand(-200, -50), { life: 1.2, size: 22, g: 300, color: '#b3442f', ch: '♪' });
}

/* ============ Spiellogik ============ */
function startGame(){
  Snd.init(); Snd.start();
  prevBest = best; recordShown = false; newIdx = -1;
  const pr = poolFor(yearFrom, yearTo); activePool = pr.pool; activeArtists = [...new Set(activePool.map(x => x[1]))];
  const key = yearFrom + '-' + yearTo; if (key !== deckKey){ deck = []; deckKey = key; }
  score = 0; speed = 150; gates.length = 0; parts.length = 0;
  state = 'play'; tx = gx = W/2; tilt = 0; flash = 0; shake = 0;
  gates.push(makeGate(-70));
  overlay.classList.remove('show');
}
function resolveGate(g){
  const lane = clamp(Math.floor(gx / (W/3)), 0, 2);
  g.chosen = lane;
  if (lane === g.correct){
    g.state = 'right'; score++;
    Snd.right(score - 1); if (score % 5 === 0) Snd.milestone();
    burst(gx, guitarY);
    if (score > best) best = score;
    if (!recordShown && prevBest > 0 && score > prevBest){
      recordShown = true; Snd.milestone();
      parts.push({ type: 'text', x: W/2, y: H*.32, vx: 0, vy: -25, g: 0, life: 1.8, max: 1.8, size: 30, ch: 'Neuer Rekord!', color: '#ffe29a', rot: 0, vr: 0 });
    }
  } else {
    g.state = 'wrong'; die(g);
  }
}
function die(g){
  state = 'dying'; dieT = 0; shake = 1; flash = 1; overShown = false; deadGate = g;
  newIdx = addScore(score); Snd.wrong(); debris(gx, guitarY);
}
let deadGate = null;

function showOverlay(o){
  $('ovTitle').textContent = o.title; $('ovText').textContent = o.text;
  $('ovHint').hidden = !o.hint; if (o.hint) $('ovHint').textContent = o.hint;
  renderBoard(o.hi ?? -1, o.limit || 5); overlay.scrollTop = 0;
  const st = $('stats');
  if (o.stats){ st.hidden = false; st.innerHTML = ''; o.stats.forEach((t, i) => { const s = document.createElement('span'); s.textContent = t; if (i) s.className = 'small'; st.appendChild(s); }); }
  else st.hidden = true;
  btn.textContent = o.btn; overlay.classList.add('show'); setTimeout(() => btn.focus({ preventScroll: true }), 60);
}
function showGameOver(){
  const g = deadGate; overShown = true;
  const record = score > 0 && prevBest > 0 && score > prevBest;
  showOverlay({
    title: record ? 'Neuer Rekord!' : 'Falscher Ton.',
    text: `„${g.title}“ ist von ${g.artist} (${g.year}).`,
    stats: [`${score} ${score === 1 ? 'Tor' : 'Tore'}`, record ? `Vorher: ${prevBest}` : `Bestwert: ${best}`],
    hi: newIdx, btn: 'Nochmal fliegen'
  });
}

function update(dt){
  time += dt;
  let v;
  if (state === 'menu') v = 55;
  else if (state === 'play'){ speed = Math.min(150 + score*5, 300); v = speed; }
  else { dieT += dt; v = speed * Math.max(.1, 1 - dieT*2.5); }
  const dv = v*dt; scroll += dv;

  for (const d of decor) d.y += dv;
  while (decor.length && decor[0].y > H + 170) decor.shift();
  decorAcc += dv; if (decorAcc >= nextDecor){ decorAcc = 0; nextDecor = rand(150, 280); spawnDecor(-150); }
  for (const m of dust){ m.y += dv*m.s; if (m.y > H + 4){ m.y = -4; m.x = rand(0, W); } }
  for (const g of gates) g.y += dv;
  while (gates.length && gates[0].y > H + 20) gates.shift();

  if (state === 'menu'){ gx = W/2 + Math.sin(time*1.2)*30; tilt = Math.cos(time*1.2)*.12; }
  else if (state === 'play'){
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir) tx += dir*540*dt;
    tx = clamp(tx, GM, W - GM);
    const prev = gx; gx += (tx - gx) * Math.min(1, dt*11);
    const vx = (gx - prev) / Math.max(dt, .001);
    tilt += (clamp(vx*.0018, -.45, .45) - tilt) * Math.min(1, dt*10);

    if (!gates.length || gates[gates.length-1].y >= spacing() - GATE_TOTAL) gates.push(makeGate(-GATE_TOTAL));
    for (const g of gates){ if (g.state === 'open' && g.y + GATE_FOCUS >= guitarY){ resolveGate(g); break; } }
  }
  if (state !== 'dying'){
    trailT -= dt;
    if (trailT <= 0){ trailT = .09;
      note(gx + rand(-7, 7), guitarY + 32, rand(-12, 12), v*.7 + rand(0, 30), { life: .9, size: rand(12, 20), color: Math.random() < .5 ? '#f6e7c1' : '#f2b441', back: true }); }
  }
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i]; p.life -= dt; if (p.life <= 0){ parts.splice(i, 1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += p.g*dt; p.rot += p.vr*dt;
  }
  shake = Math.max(0, shake - dt*2.2); flash = Math.max(0, flash - dt*2.5);
  if (state === 'dying' && !overShown && dieT > 1.2) showGameOver();
}

/* ============ Zeichnen ============ */
function drawBackground(){
  const off = scroll % TH;
  for (let y = off - TH; y < H; y += TH) ctx.drawImage(wood, 0, y, W, TH);
  // Deko
  for (const d of decor){
    ctx.save(); ctx.translate(d.x + d.size/2, d.y + d.size/2); ctx.rotate(d.rot); ctx.globalAlpha = .3;
    ctx.drawImage(SPRITES[d.type], -d.size/2, -d.size/2, d.size, d.size); ctx.restore();
  }
  // Bühnenlicht
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  [W*.22, W*.78].forEach(cx => {
    const g = ctx.createLinearGradient(0, 0, 0, H*.8); g.addColorStop(0, 'rgba(255,190,100,.10)'); g.addColorStop(1, 'rgba(255,190,100,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx - 14, 0); ctx.lineTo(cx + 14, 0); ctx.lineTo(cx + 120, H*.8); ctx.lineTo(cx - 120, H*.8); ctx.fill();
  });
  for (const m of dust){ ctx.fillStyle = `rgba(255,214,150,${m.a})`; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.3); ctx.fill(); }
  ctx.restore();
}
function drawCurtains(){
  for (const side of [0, 1]){
    ctx.save(); if (side){ ctx.translate(W, 0); ctx.scale(-1, 1); }
    const g = ctx.createLinearGradient(0, 0, 13, 0);
    g.addColorStop(0, '#2c0a07'); g.addColorStop(.35, '#7a2218'); g.addColorStop(.6, '#4b130d'); g.addColorStop(1, '#220806');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 13, H);
    const s = ctx.createLinearGradient(13, 0, 40, 0); s.addColorStop(0, 'rgba(0,0,0,.4)'); s.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = s; ctx.fillRect(13, 0, 27, H); ctx.restore();
  }
}

function drawGate(g){
  const lw = W/3, y = g.y;
  if (!g.fit || g.fit.w !== W){
    const bw = W - 28, sw = lw - 24;
    g.fit = { w: W,
      title: fit(`„${g.title}“`, bw - 52, GATE_BANNER - 16, 2, 22, 12, 'italic bold'),
      opts: g.opts.map(o => fit(o, sw - 18, 66, 3, 18, 11, 'bold')) };
  }
  // Banner mit Songtitel
  const bx = 14, bw = W - 28, bh = GATE_BANNER - 4;
  ctx.strokeStyle = '#2a160a'; ctx.lineWidth = 2;
  [bx + 26, bx + bw - 26].forEach(x => { ctx.beginPath(); ctx.moveTo(x, y - 60); ctx.lineTo(x, y + 4); ctx.stroke(); });
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath();
  ctx.moveTo(bx+3, y+6); ctx.lineTo(bx+bw+3, y+6); ctx.lineTo(bx+bw-7, y+bh/2+6); ctx.lineTo(bx+bw+3, y+bh+6); ctx.lineTo(bx+3, y+bh+6); ctx.lineTo(bx+13, y+bh/2+6); ctx.fill();
  const bg = ctx.createLinearGradient(0, y, 0, y + bh); bg.addColorStop(0, '#f6e9c6'); bg.addColorStop(1, '#dcc58f');
  ctx.fillStyle = bg; ctx.beginPath();
  ctx.moveTo(bx, y); ctx.lineTo(bx+bw, y); ctx.lineTo(bx+bw-10, y+bh/2); ctx.lineTo(bx+bw, y+bh); ctx.lineTo(bx, y+bh); ctx.lineTo(bx+10, y+bh/2); ctx.closePath();
  ctx.fill(); ctx.strokeStyle = '#5b3a1c'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#2a160a'; drawLines(g.fit.title, W/2, y + bh/2 + 1);

  // Torbereich
  const y1 = y + GATE_BANNER + GATE_GAP;
  for (let i = 0; i < 3; i++){
    let top = 'rgba(255,196,110,.17)', bot = 'rgba(255,196,110,.04)';
    if (g.state !== 'open'){
      if (i === g.correct){ top = 'rgba(100,215,110,.34)'; bot = 'rgba(100,215,110,.08)'; }
      else if (i === g.chosen){ top = 'rgba(230,70,55,.4)'; bot = 'rgba(230,70,55,.1)'; }
    }
    const gr = ctx.createLinearGradient(0, y1, 0, y1 + GATE_H); gr.addColorStop(0, top); gr.addColorStop(1, bot);
    ctx.fillStyle = gr; ctx.fillRect(i*lw, y1, lw, GATE_H);
  }
  // Querbalken
  const lg = ctx.createLinearGradient(0, y1 - 4, 0, y1 + 8); lg.addColorStop(0, '#74492a'); lg.addColorStop(1, '#3a2212');
  ctx.fillStyle = lg; ctx.fillRect(0, y1 - 4, W, 12);
  ctx.fillStyle = 'rgba(201,139,43,.8)'; ctx.fillRect(0, y1 - 4, W, 1.5);
  // Schilder
  for (let i = 0; i < 3; i++){
    const sx = i*lw + 12, sw = lw - 24, sy = y1 + 16, sh = GATE_H - 32;
    let fill = '#2a170b', stroke = '#c98b2b', alpha = 1;
    if (g.state !== 'open'){
      if (i === g.correct){ fill = '#25502b'; stroke = '#9be89b'; }
      else if (i === g.chosen){ fill = '#5a1d17'; stroke = '#ff8f80'; }
      else alpha = .5;
    }
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#1a0e06'; ctx.lineWidth = 1.5;
    [sx + 14, sx + sw - 14].forEach(x => { ctx.beginPath(); ctx.moveTo(x, y1 + 6); ctx.lineTo(x, sy + 2); ctx.stroke(); });
    ctx.fillStyle = 'rgba(0,0,0,.4)'; rr(ctx, sx + 2, sy + 4, sw, sh, 7); ctx.fill();
    ctx.fillStyle = fill; rr(ctx, sx, sy, sw, sh, 7); ctx.fill();
    ctx.strokeStyle = stroke; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#f6e7c1'; drawLines(g.fit.opts[i], sx + sw/2, sy + sh/2 + 1);
    ctx.globalAlpha = 1;
  }
  // Pfosten = Gitarrenhälse
  for (let i = 0; i < 4; i++){
    const px = i*lw, top = y1 - 8, hgt = GATE_H + 12;
    ctx.fillStyle = '#5a371d'; ctx.fillRect(px - 7, top, 14, hgt);
    ctx.fillStyle = '#24120a'; ctx.fillRect(px - 4.5, top + 4, 9, hgt - 4);
    ctx.fillStyle = 'rgba(214,170,90,.85)';
    for (let fy = top + 14; fy < top + hgt; fy += 14) ctx.fillRect(px - 4.5, fy, 9, 1.3);
    ctx.fillStyle = '#c98b2b'; ctx.beginPath(); ctx.arc(px, top - 1, 5.5, 0, 6.3); ctx.fill();
    ctx.strokeStyle = '#2a160a'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,240,200,.5)'; ctx.beginPath(); ctx.arc(px - 1.5, top - 2.5, 1.5, 0, 6.3); ctx.fill();
  }
}

function drawGuitar(x, y, rot, type){
  const G = GUITARS[type], s = (G.size || 80) / (G.bottom - G.top), mid = (G.top + G.bottom) / 2;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.translate(0, -mid);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = radial(ctx, [[0, 'rgba(255,190,90,.22)'], [1, 'rgba(255,190,90,0)']], 0, mid, 4, 90);
  ctx.fillRect(-90, mid - 90, 180, 180); ctx.restore();
  G.shape(ctx);
  ctx.restore();
}

function drawParticles(back){
  for (const p of parts){
    if (!!p.back !== back) continue;
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    if (p.type === 'dot'){ ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.3); ctx.fill(); }
    else {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.type === 'chip'){ ctx.fillStyle = p.color; ctx.fillRect(-p.size, -p.size/2, p.size*2, p.size); }
      else {
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        if (p.type === 'text'){ ctx.font = `bold ${p.size}px Georgia, serif`; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,14,5,.8)'; ctx.strokeText(p.ch, 0, 0); }
        else ctx.font = `${p.size}px serif`;
        ctx.fillStyle = p.color; ctx.fillText(p.ch, 0, 0);
      }
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

function drawHUD(){
  if (state === 'menu') return;
  const label = `♪ ${score}`; ctx.font = 'bold 21px Georgia, serif';
  const w1 = ctx.measureText(label).width;
  let bw = w1 + 28, bestTxt = '';
  if (best > 0){ bestTxt = `Bestwert ${best}`; ctx.font = '13px Georgia, serif'; bw += ctx.measureText(bestTxt).width + 12; }
  ctx.fillStyle = 'rgba(30,16,8,.78)'; rr(ctx, 14, 14, bw, 38, 10); ctx.fill();
  ctx.strokeStyle = '#c98b2b'; ctx.lineWidth = 2; ctx.stroke();
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = '#f6e7c1'; ctx.font = 'bold 21px Georgia, serif'; ctx.fillText(label, 28, 34);
  if (bestTxt){ ctx.fillStyle = 'rgba(246,231,193,.65)'; ctx.font = '13px Georgia, serif'; ctx.fillText(bestTxt, 28 + w1 + 12, 35); }
}

function draw(){
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5)*shake*14, (Math.random() - .5)*shake*14);
  drawBackground();
  drawCurtains();
  for (const g of gates) drawGate(g);
  drawParticles(true);
  if (state !== 'dying') drawGuitar(gx, guitarY, tilt, guitarType);
  drawParticles(false);
  ctx.restore();
  // Vignette
  const cx = W/2, cy = H*.55, vg = ctx.createRadialGradient(cx, cy, Math.min(W, H)*.3, cx, cy, Math.max(W, H)*.85);
  vg.addColorStop(0, 'rgba(8,3,1,0)'); vg.addColorStop(1, 'rgba(8,3,1,.65)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (flash > 0){ ctx.fillStyle = `rgba(200,40,30,${flash*.3})`; ctx.fillRect(0, 0, W, H); }
  drawHUD();
}

/* ============ Eingabe ============ */
let dragging = false, dragX = 0, dragT = 0;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('#overlay') || e.target.closest('#mute')) return;
  dragging = true; dragX = e.clientX; dragT = tx;
  if (e.pointerType === 'mouse') tx = clamp(e.clientX - stage.getBoundingClientRect().left, GM, W - GM);
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
});
stage.addEventListener('pointermove', e => {
  if (state !== 'play') return;
  if (e.pointerType === 'mouse') tx = clamp(e.clientX - stage.getBoundingClientRect().left, GM, W - GM);
  else if (dragging) tx = clamp(dragT + (e.clientX - dragX)*1.2, GM, W - GM);
});
const endDrag = () => { dragging = false; };
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;

muteBtn.addEventListener('click', () => {

/* ============ Bestenliste & Gitarrenwahl ============ */
function renderBoard(hi, limit){
  const el = $('board');
  if (!board.length){ el.hidden = true; return; }
  el.hidden = false; el.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = 'Bestenliste'; el.appendChild(h);
  const ol = document.createElement('ol');
  board.slice(0, limit).forEach((e, i) => {
    const li = document.createElement('li'); if (i === hi) li.className = 'new';
    li.innerHTML = `<span class="r">${i + 1}.</span><span class="s">${e.s} ${e.s === 1 ? 'Tor' : 'Tore'}</span><span class="y">${e.r || ''}</span><span class="d">${e.d || ''}</span>`;
    ol.appendChild(li);
  });
  el.appendChild(ol);
}
function buildPicker(){
  const p = $('picker'); p.innerHTML = '';
  GUITARS.forEach((G, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'gbtn';
    b.setAttribute('aria-pressed', String(i === guitarType));
    const c = document.createElement('canvas'); c.width = 80; c.height = 136;
    const g = c.getContext('2d'), s = 124 * (G.size || 80) / 80 / (G.bottom - G.top);
    g.translate(40, 68); g.scale(s, s); g.translate(0, -(G.top + G.bottom) / 2); G.shape(g);
    const l = document.createElement('span'); l.textContent = G.name;
    b.append(c, l);
    b.addEventListener('click', () => {
      guitarType = i; Snd.init(); Snd.setVoice(i); Snd.start();
      try { localStorage.setItem('saitenflug_guitar', String(i)); } catch (e) {}
      [...p.children].forEach((x, k) => x.setAttribute('aria-pressed', String(k === i)));
    });
    p.appendChild(b);
  });
}

function setupYears(){
  const f = $('yFrom'), t = $('yTo'), fill = $('yFill');
  const paint = () => {
    f.value = yearFrom; t.value = yearTo;
    $('yLabel').textContent = `${yearFrom} – ${yearTo}`;
    const r = poolFor(yearFrom, yearTo);
    $('yCount').textContent = `${r.count} Songs${r.widened ? ' + Nachbarjahre' : ''}`;
    const a = (yearFrom - YMIN) / (YMAX - YMIN), b = (yearTo - YMIN) / (YMAX - YMIN);
    fill.style.left = `calc(13px + (100% - 26px) * ${a})`;
    fill.style.right = `calc(13px + (100% - 26px) * ${1 - b})`;
    f.style.zIndex = yearFrom > 1988 ? 3 : 1; t.style.zIndex = 2;
  };
  const save = () => { try { localStorage.setItem('saitenflug_range', JSON.stringify([yearFrom, yearTo])); } catch (e) {} };
  f.addEventListener('input', () => { yearFrom = Math.min(+f.value, yearTo - 2); paint(); save(); });
  t.addEventListener('input', () => { yearTo = Math.max(+t.value, yearFrom + 2); paint(); save(); });
  paint();
}

/* ============ Start ============ */
Snd.setVoice(guitarType); buildPicker(); renderBoard(-1, 3); setupYears();
resize();
let last = performance.now();
function frame(ts){
  const dt = Math.min(.05, (ts - last)/1000 || 0); last = ts;
  update(dt); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
